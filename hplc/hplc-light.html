<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HPLC system</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(940px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--bx-lcd:#0a0a0a}
.iso[data-theme="light"]{--bx-lcd:#e8e8e5}
.bx-lcd{fill:var(--bx-lcd);stroke:none}
.bx-trace{stroke-width:.75}
.bx-pen{fill:var(--anatomy-hi)}
.bx-lcd-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.02em}
.bx-stage{touch-action:pan-y;border-radius:2px}
.bx-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.bx-stage[data-layers]{display:grid;grid-template-columns:minmax(0,1fr)}
.bx-stage[data-layers]>*{grid-area:1/1}
.bx-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;margin:18px 0 0;font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.bx-ctl{display:inline-flex;align-items:center;gap:10px}
.bx-ctl-name{text-transform:uppercase;letter-spacing:.1em;color:var(--anatomy-muted)}
.bx-ctl input{width:150px;accent-color:var(--anatomy-hi);margin:0}
.bx-ctl output{min-width:9ch}
.bx-note{color:var(--anatomy-muted)}
.bx-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.bx-controls{gap:8px 14px}.bx-ctl input{width:120px}}
@media (max-width:560px){.bx-stage{overflow:hidden;margin:0 -12px}.iso-plate .bx-stage>:is(svg,canvas){width:118%;max-width:none;margin:0 0 0 -9%}}
.iso{--hp-bed:#0d0d0d}
.iso[data-theme="light"]{--hp-bed:#d6d6d3}
.hp-bed{fill:var(--hp-bed);stroke:none}
.hp-frit{fill:var(--anatomy-mid);opacity:.55;stroke:none}
.hp-band{fill:var(--anatomy-lit);stroke:var(--anatomy-lit);stroke-width:.4;stroke-linejoin:round}
.hp-groove{fill:var(--anatomy-shade-0)}

// Pure HPLC model: every number the figure shows comes from here.
// Reversed-phase C18 column, water / acetonitrile. Values are illustrative but physically consistent.

const COLUMN = { L: 0.15, d: 4.6e-3, dp: 5e-6, eps: 0.4, epsTotal: 0.65, plates: 12000 };

const ANALYTES = [
  { name: "A", kw: 6.0, S: 3.2 },
  { name: "B", kw: 30, S: 4.4 },
  { name: "C", kw: 160, S: 5.6 },
];

const LIMITS = { flow: [0.2, 2.0], phi0: [0.05, 0.9], phi1: [0.05, 0.95], tG: [2, 20], pMax: 400 };

const area = () => Math.PI * (COLUMN.d / 2) ** 2;

// Water / ACN mixture viscosity (mPa*s), quadratic fit with the known maximum near 20% ACN.
const viscosity = (phi) => 0.89 * (1 - phi) + 0.37 * phi + 0.9 * phi * (1 - phi);

// Kozeny-Carman backpressure (bar) for flow in mL/min and ACN fraction phi.
function pressure(flow, phi) {
  const u = (flow * 1e-6 / 60) / area();
  const e = COLUMN.eps;
  const dP = (150 * viscosity(phi) * 1e-3 * u * COLUMN.L * (1 - e) ** 2) / (e ** 3 * COLUMN.dp ** 2);
  return dP / 1e5;
}

// Dead time (min): total porosity volume over flow.
const deadTime = (flow) => (COLUMN.epsTotal * area() * COLUMN.L * 1e6) / flow;

const retentionFactor = (a, phi) => 10 ** (Math.log10(a.kw) - a.S * phi);

// Linear gradient from phi0 to phi1 over tG minutes, held at phi1 afterwards.
const phiAt = (t, { phi0, phi1, tG }) => (t >= tG ? phi1 : phi0 + ((phi1 - phi0) * Math.max(t, 0)) / tG);

// Retention time (min) by integrating the band migration dx/dt = 1 / (t0 (1 + k(phi(t)))) until x = 1.
function retentionTime(a, { flow, phi0, phi1, tG }) {
  const t0 = deadTime(flow);
  const dt = 0.005;
  let x = 0;
  let t = 0;
  while (x < 1 && t < 200) {
    x += dt / (t0 * (1 + retentionFactor(a, phiAt(t, { phi0, phi1, tG }))));
    t += dt;
  }
  return t;
}

// Full run state: retention times, peak widths, pressure trace and chromogram sampler.
function run(params) {
  const t0 = deadTime(params.flow);
  const peaks = ANALYTES.map((a) => {
    const tR = retentionTime(a, params);
    // Peak width grows with retention; gradient compression is ignored on purpose.
    return { name: a.name, tR, sigma: tR / Math.sqrt(COLUMN.plates), height: 1 };
  });
  const end = Math.max(...peaks.map((p) => p.tR)) * 1.1;
  const signal = (t) => peaks.reduce((s, p) => s + p.height * Math.exp(-0.5 * ((t - p.tR) / p.sigma) ** 2), 0);
  const pressureAt = (t) => pressure(params.flow, phiAt(t, params));
  return { t0, peaks, end, signal, phiAt: (t) => phiAt(t, params), pressureAt, pMax: Math.max(pressureAt(0), pressureAt(end)) };
}

const DEFAULTS = { flow: 1.0, phi0: 0.2, phi1: 0.8, tG: 10 };

// Live runtime shared by the bench figures. A plain script (no import or export): the build inlines it after the kit
// and the figure's model, before the figure's live.js, all in one module scope. Its top-level names are exactly
// clamp, smoothstep, screenOf, ease and liveStage; scriptOf (common/bench.mjs) fails the build on any clash.

// clamp v to [lo, hi]
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
// cubic ease of x across [a, b], 0 below and 1 above
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// screen offset of the world vector v under projection proj
const screenOf = (v, proj) => { const a = iso([0, 0, 0], proj), b = iso(v, proj); return [b[0] - a[0], b[1] - a[1]]; };
// first-order approach of `from` toward `to` with time constant tau (s) over a step dt (s)
const ease = (from, to, tau, dt) => from + (to - from) * (1 - Math.exp(-dt / tau));

// Drive a focusable stage (role=slider): rAF loop while visible, reduced motion, an idle tour, keys and announcements.
// opts.step(dt)      one frame, dt in s (at most 1/30)
// opts.rest()        draw the single representative frame shown under reduced motion
// opts.apply(next)   take a steered setting (from keys or sliders); the stage then announces and redraws
// opts.say()         text for the polite live region, read 700 ms after the last change
// opts.key           { value(), step, big, min, max, to(v) → next }: arrows ±step (Shift ±big), Home/End to the limits
// opts.tour, opts.idle   settings to cycle through while nobody steers, resuming idle ms after the last input (3600)
// Returns { media, steer, start, nextStop, begin }: nextStop() is the next tour setting, or null when not touring;
// begin(first) shows the reduced-motion frame or calls first() to paint frame zero.
function liveStage(stage, opts) {
  const media = matchMedia("(prefers-reduced-motion: reduce)");
  const liveEl = document.querySelector("[data-live]");
  const tour = opts.tour ?? [];
  const idle = opts.idle ?? 3600;
  let raf = 0, last = 0, visible = false, touring = !media.matches, idleTimer = 0, stop = 0, quiet = 0;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    opts.step(dt);
    raf = visible ? requestAnimationFrame(tick) : 0;
  }
  const start = () => { if (!raf && visible && !media.matches) { last = 0; raf = requestAnimationFrame(tick); } };
  function announce() {
    clearTimeout(quiet);
    quiet = setTimeout(() => { liveEl.textContent = opts.say(); }, 700);
  }
  function steer(next) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { touring = !media.matches; }, idle);
    opts.apply(next);
    announce();
    if (media.matches) opts.rest();
    else start();
  }
  const pause = () => { touring = false; clearTimeout(idleTimer); };
  const resumeLater = () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !media.matches; }, idle); };
  const key = opts.key;
  if (key) stage.addEventListener("keydown", (event) => {
    const step = event.shiftKey ? key.big : key.step;
    let v = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp") v = key.value() + step;
    if (event.key === "ArrowLeft" || event.key === "ArrowDown") v = key.value() - step;
    if (event.key === "Home") v = key.min;
    if (event.key === "End") v = key.max;
    if (v === null) return;
    event.preventDefault();
    steer(key.to(v));
  });
  stage.addEventListener("pointerenter", pause);
  stage.addEventListener("pointerleave", resumeLater);
  stage.addEventListener("focus", () => { pause(); liveEl.textContent = stage.getAttribute("aria-valuetext"); });
  stage.addEventListener("blur", resumeLater);
  media.addEventListener?.("change", () => { touring = !media.matches; if (media.matches) opts.rest(); else start(); });
  new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) start(); }, { rootMargin: "120px 0px" }).observe(stage);
  return {
    media,
    steer,
    start,
    nextStop() {
      if (!touring || !tour.length) return null;
      stop = (stop + 1) % tour.length;
      return tour[stop];
    },
    begin(first) {
      if (media.matches) { touring = false; opts.rest(); }
      else first();
    },
  };
}

// Live behaviour for the HPLC figure. Inlined above it: the kit (iso, pathOf, translateAlong, holdStill),
// model.mjs (run, pressure, phiAt, retentionFactor, deadTime, ANALYTES, COLUMN, LIMITS) and
// common/live-core.js (clamp, smoothstep, screenOf, ease, liveStage).
const DATA = {"P":{"origin":[382.91109723012164,314.218322071958],"scale":1.0807573324194122,"azimuth":55,"elevation":30},"ecc":1.6,"strokeML":0.02,"pistons":["A","B"],"gauge":{"x":-74,"y":41.5,"z":44.15,"r":5.4},"colF":{"o":[-35,11.2,68],"a":[1,0,0],"u":[0,1,0],"v":[0,0,1]},"colR":3.4,"win":{"s0":6.4,"s1":63.6,"a0":-0.08418180650979745,"a1":1.3120815950856661},"colLen":70,"valve":{"x":-40,"y":14,"r":9.5,"z":138},"portR":6.6,"portAng":[25,85,145,205,265,325],"needle":{"x":-20,"y":0,"down":12,"tipRest":158,"vials":[-2,10,22,34],"vialTop":155,"seatTop":145},"plot":{"x0":138,"x1":190,"z0":39,"z1":67},"screen":{"x0":134,"x1":190,"z0":34,"z1":74,"r":2.4},"defaults":{"flow":1,"phi0":0.2,"phi1":0.8,"tG":10},"limits":{"flow":[0.2,2],"phi0":[0.05,0.9],"phi1":[0.05,0.95],"tG":[2,20],"pMax":400},"speed":0.6};
const { P } = DATA;
const stage = document.querySelector(".bx-stage");
const svg = stage.querySelector("svg");
const part = (name) => svg.querySelector(`[data-part="${name}"]`);
const readout = document.querySelector("[data-readout]");
const methodEl = document.querySelector("[data-note]");
const inputs = { flow: document.querySelector('[data-ctl="flow"]'), phi1: document.querySelector('[data-ctl="phi1"]') };
const outputs = { flow: document.querySelector('[data-out="flow"]'), phi1: document.querySelector('[data-out="phi1"]') };

// ---------------------------------------------------------------- method and its precomputed run
const params = { ...DATA.defaults };
let method, bands, axisMax, tracePts;
function prepare() {
  method = run(params);
  axisMax = Math.max(2, Math.ceil(method.end));
  // band position along the bed (0 → 1) by the same migration law the model integrates
  const t0 = method.t0;
  const dt = 0.005;
  bands = ANALYTES.map((a) => {
    const xs = [0];
    let x = 0, t = 0;
    while (x < 1 && t < 200) { x += dt / (t0 * (1 + retentionFactor(a, phiAt(t, params)))); t += dt; xs.push(Math.min(1, x)); }
    return { name: a.name, xs, dt };
  });
  const { x0, x1, z0, z1 } = DATA.plot;
  const n = 1600;
  const top = 1.15;
  let d = "";
  for (let i = 0; i <= n; i++) {
    const t = (axisMax * i) / n;
    const x = x0 + ((x1 - x0) * i) / n;
    const y = -(z0 + ((z1 - z0) * Math.min(top, method.signal(t))) / top);
    d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
  }
  part("trace").setAttribute("d", d);
  tracePts = { top };
  let ticks = "";
  for (let m = 1; m < axisMax; m++) { const x = x0 + ((x1 - x0) * m) / axisMax; ticks += `M${x.toFixed(2)} ${(-z0).toFixed(2)}v${m % 5 ? 1.2 : 2}`; }
  part("ticks").setAttribute("d", ticks);
  const yb = (phi) => -(z0 + (z1 - z0) * phi);
  const xg = x0 + ((x1 - x0) * Math.min(params.tG, axisMax)) / axisMax;
  part("gradient").setAttribute("d", `M${x0} ${yb(params.phi0).toFixed(2)}L${xg.toFixed(2)} ${yb(phiAt(Math.min(params.tG, axisMax), params)).toFixed(2)}H${DATA.screen.x1}`);
  methodEl.textContent = `t0 ${method.t0.toFixed(2)} · tR ${method.peaks.map((p) => `${p.name} ${p.tR.toFixed(2)}`).join(" · ")} min · ${Math.round(method.pMax)} bar max`;
  stage.setAttribute("aria-valuenow", params.flow.toFixed(2));
  stage.setAttribute("aria-valuetext", `Flow ${params.flow.toFixed(2)} mL/min, final ${Math.round(params.phi1 * 100)} percent B, ${Math.round(pressure(params.flow, params.phi0))} bar at the start, peaks at ${method.peaks.map((p) => p.tR.toFixed(2)).join(", ")} min`);
  for (const key of ["flow", "phi1"]) {
    const text = key === "flow" ? `${params.flow.toFixed(2)} mL/min` : `${Math.round(params.phi1 * 100)} %`;
    if (Number(inputs[key].value) !== (key === "flow" ? params.flow : Math.round(params.phi1 * 100))) inputs[key].value = key === "flow" ? params.flow : Math.round(params.phi1 * 100);
    inputs[key].setAttribute("aria-valuetext", key === "flow" ? text : `${Math.round(params.phi1 * 100)} percent acetonitrile`);
    outputs[key].textContent = text;
  }
}
const bandAt = (b, t) => { if (t <= 0) return 0; const i = t / b.dt; const j = Math.floor(i); if (j >= b.xs.length - 1) return 1; return b.xs[j] + (b.xs[j + 1] - b.xs[j]) * (i - j); };

// ---------------------------------------------------------------- the cycle: sample, inject, run, reset
const T = { toVial: 0.9, down: 0.6, dwell: 0.5, up: 0.6, toSeat: 0.9, seat: 0.6, valve: 0.5, lift: 0.6, back: 0.5, hold: 1.4 };
const INJECT = T.toVial + T.down + T.dwell + T.up + T.toSeat + T.seat + T.valve;
const runSeconds = () => method.end / DATA.speed;
let c = 0; // cycle clock, page seconds
let vial = 0;
function poseAt(cc) {
  const N = DATA.needle;
  const vx = N.vials[vial % N.vials.length];
  let x = N.x, down = 0, valve = 0, phase = "sampling";
  let k = cc;
  const seg = (len) => { const s = clamp(k / len, 0, 1); k -= len; return smoothstep(0, 1, s); };
  const a = seg(T.toVial), b = seg(T.down), _ = seg(T.dwell), u = seg(T.up), s = seg(T.toSeat), d = seg(T.seat), v = seg(T.valve);
  x = N.x + (vx - N.x) * (a - s);
  down = N.down * (b - u + d);
  valve = v;
  void _;
  const tRun = cc > INJECT ? (cc - INJECT) * DATA.speed : 0;
  if (cc > INJECT) phase = tRun < method.end ? "run" : "done";
  if (cc > INJECT + runSeconds()) {
    const k2 = cc - INJECT - runSeconds();
    down = N.down * (1 - smoothstep(0, T.lift, k2));
    valve = 1 - smoothstep(T.lift, T.lift + T.back, k2);
  }
  return { x, down, valve, tRun: Math.min(tRun, method.end), phase };
}
const cycleLength = () => INJECT + runSeconds() + T.lift + T.back + T.hold;

// ---------------------------------------------------------------- drawing
const pistons = DATA.pistons.map((id) => ({ id, cam: part("cam" + id), rod: part("piston" + id), theta: 0 }));
const unitX = screenOf([1, 0, 0], P);
const carriage = part("carriage");
const needle = part("needle");
const cut = part("cut");
const grooves = part("grooves");
const gauge = part("gauge");
const bandsEl = part("bands");
const reveal = part("reveal");
const pen = part("pen");
const clockEl = part("clock");
const phaseEl = part("phase");
const shown = { x: DATA.needle.x, down: 0, valve: 0, p: pressure(params.flow, params.phi0) };

function patch(s0, s1) {
  const F = DATA.colF, r = DATA.colR, a0 = DATA.win.a0, a1 = DATA.win.a1, n = 10;
  const pt = (s, a) => iso([0, 1, 2].map((i) => F.o[i] + F.a[i] * s + r * (F.u[i] * Math.cos(a) + F.v[i] * Math.sin(a))), P);
  const out = [];
  for (let i = 0; i <= n; i++) out.push(pt(s0, a0 + ((a1 - a0) * i) / n));
  for (let i = n; i >= 0; i--) out.push(pt(s1, a0 + ((a1 - a0) * i) / n));
  return "M" + out.map(([x, y]) => x.toFixed(2) + " " + y.toFixed(2)).join("L") + "Z";
}
function grooveD(alpha) {
  const { x, y, z } = DATA.valve;
  const pairs = [[205, 265], [325, 25], [85, 145]];
  const pt = (deg, rr) => [x + rr * Math.cos(deg * Math.PI / 180), y + rr * Math.sin(deg * Math.PI / 180)];
  return pairs.map(([a, b]) => {
    const p = pt(a + alpha, DATA.portR), q = pt(b + alpha, DATA.portR);
    const ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
    const w = 0.95;
    const ring = [];
    for (let i = 0; i <= 8; i++) { const t = ang + Math.PI / 2 + (Math.PI * i) / 8; ring.push([q[0] + w * Math.cos(t), q[1] + w * Math.sin(t)]); }
    for (let i = 0; i <= 8; i++) { const t = ang - Math.PI / 2 + (Math.PI * i) / 8; ring.push([p[0] + w * Math.cos(t), p[1] + w * Math.sin(t)]); }
    return pathOf(ring.map(([u, v]) => iso([u, v, z + 8], P)), true);

}
function gaugeD(p) {
  const g = DATA.gauge;
  const A = (-135 + 270 * clamp(p / LIMITS.pMax, 0, 1)) * Math.PI / 180;
  const tail = iso([g.x - Math.sin(A) * 1.4, g.y + Math.cos(A) * 1.4, g.z], P);
  const tip = iso([g.x + Math.sin(A) * g.r, g.y - Math.cos(A) * g.r, g.z], P);

}
function entryZ(x) {
  const N = DATA.needle;
  if (N.vials.some((vx) => Math.abs(vx - x) < 2.4)) return N.vialTop;
  if (Math.abs(x - N.x) < 1.6) return N.seatTop;

}
let lastText = "";
function draw(pose, phi) {
  const N = DATA.needle;
  // pistons: displacement e(1 − cos θ) out of the gland, cam centre on its circle
  for (const p of pistons) {
    const e = DATA.ecc;
    p.cam.setAttribute("transform", translateAlong(P, [e * Math.cos(p.theta) - e, 0, e * Math.sin(p.theta)]));
    const d = e * (1 - Math.cos(p.theta));
    const off = [-unitX[0] * d, -unitX[1] * d];
    p.rod.setAttribute("transform", `translate(${off[0].toFixed(2)} ${off[1].toFixed(2)})`);
    holdStill(p.rod, off);
  }
  // autosampler
  const dx = shown.x - N.x;
  const carOff = screenOf([dx, 0, 0], P);
  carriage.setAttribute("transform", `translate(${carOff[0].toFixed(2)} ${carOff[1].toFixed(2)})`);
  const nOff = screenOf([0, 0, -shown.down], P);
  needle.setAttribute("transform", `translate(${nOff[0].toFixed(2)} ${nOff[1].toFixed(2)})`);
  holdStill(needle, nOff);
  const ez = entryZ(shown.x);
  const yCut = ez === null ? 4000 : iso([N.x, N.y, ez], P)[1];
  cut.setAttribute("height", String(yCut + 2000));

  gauge.setAttribute("d", gaugeD(shown.p));

  let bd = "";

      const x = bandAt(b, pose.tRun);
      if (x <= 0 || x >= 1) continue;
      const sc = s0 + (s1 - s0) * x;

  const { x0, x1, z0, z1 } = DATA.plot;
  const tr = pose.phase === "sampling" ? 0 : pose.tRun;
  const px = x0 + ((x1 - x0) * tr) / axisMax;
  reveal.setAttribute("width", (px - DATA.screen.x0).toFixed(2));
  pen.setAttribute("cx", px.toFixed(2));
  pen.setAttribute("cy", (-(z0 + ((z1 - z0) * Math.min(tracePts.top, method.signal(tr))) / tracePts.top)).toFixed(2));
  clockEl.textContent = `t ${tr.toFixed(2)} min`;
  phaseEl.textContent = `${Math.round(phi * 100)} %B`;
  // readout: words and numbers from the same instant
  const bar = Math.round(shown.p);
  let text;
  if (pose.phase === "sampling") text = `sampling · ${params.flow.toFixed(2)} mL/min · ${bar} bar`;
  else {
    const next = method.peaks.find((p) => p.tR > tr) ?? method.peaks[method.peaks.length - 1];
    text = `${params.flow.toFixed(2)} mL/min · ${bar} bar · ${Math.round(phi * 100)} %B · tR ${next.name} ${next.tR.toFixed(2)} min`;
  }
  if (text !== lastText) { readout.textContent = text; lastText = text; }
}

// ---------------------------------------------------------------- loop (rAF, reduced motion, tour, keys, live region: live-core)
const TOUR = [{ flow: 1.0, phi1: 0.8 }, { flow: 1.6, phi1: 0.8 }, { flow: 1.6, phi1: 0.95 }, { flow: 0.6, phi1: 0.6 }];
function advance(dt) {
  c += dt;
  if (c >= cycleLength()) {
    c = 0;
    vial++;
    const stop = live.nextStop();
    if (stop) { Object.assign(params, stop); prepare(); }
  }
  const pose = poseAt(c);
  const phi = pose.phase === "sampling" ? params.phi0 : phiAt(pose.tRun, params);
  shown.x = ease(shown.x, pose.x, 0.06, dt);
  shown.down = ease(shown.down, pose.down, 0.06, dt);
  shown.valve = ease(shown.valve, pose.valve, 0.08, dt);
  shown.p = ease(shown.p, pressure(params.flow, phi), 0.25, dt);
  // each channel strokes at its own share of the flow: f = q / V_stroke
  const q = [params.flow * (1 - phi), params.flow * phi];
  pistons.forEach((p, i) => { p.theta = (p.theta + (2 * Math.PI * q[i] * dt) / (DATA.strokeML * 60)) % (2 * Math.PI); });
  draw(pose, phi);
}
function stillFrame() {
  // reduced motion: one representative frame, the finished run with the needle in its seat
  const pose = { x: DATA.needle.x, down: DATA.needle.down, valve: 1, tRun: method.end, phase: "done" };
  Object.assign(shown, { x: pose.x, down: pose.down, valve: 1, p: pressure(params.flow, phiAt(method.end, params)) });
  draw(pose, phiAt(method.end, params));
}
function retune(next) {
  const flow = next.flow ?? params.flow;
  const phi1 = next.phi1 ?? params.phi1;
  params.flow = Math.round(clamp(flow, LIMITS.flow[0], LIMITS.flow[1]) * 100) / 100;
  params.phi1 = Math.round(clamp(phi1, 0.4, LIMITS.phi1[1]) * 100) / 100;
  prepare();
  // a new method re-injects: the run restarts at the valve switch, the needle already in its seat
  if (c > INJECT) c = INJECT;
}
const live = liveStage(stage, {
  step: advance,
  rest: stillFrame,
  apply: retune,
  say: () => `Flow ${params.flow.toFixed(2)} millilitres per minute, final ${Math.round(params.phi1 * 100)} percent B: peaks at ${method.peaks.map((p) => p.tR.toFixed(2)).join(", ")} minutes, ${Math.round(method.pMax)} bar.`,
  key: { value: () => params.flow, step: 0.05, big: 0.25, min: LIMITS.flow[0], max: LIMITS.flow[1], to: (flow) => ({ flow }) },
  tour: TOUR,
});
inputs.flow.addEventListener("input", () => live.steer({ flow: Number(inputs.flow.value) }));
inputs.phi1.addEventListener("input", () => live.steer({ phi1: Number(inputs.phi1.value) / 100 }));
prepare();
live.begin(() => draw(poseAt(0), params.phi0));
</script></body></html>
