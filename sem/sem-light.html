<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scanning electron microscope</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--bx-lcd:#0a0a0a}
.iso[data-theme="light"]{--bx-lcd:#e8e8e5}
.bx-lcd{fill:var(--bx-lcd);stroke:none}
.bx-trace{stroke-width:.75}
.bx-pen{fill:var(--anatomy-hi)}
.bx-lcd-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.02em}
.bx-stage{touch-action:pan-y;border-radius:2px}
.bx-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.bx-stage[data-layers]{display:grid;grid-template-columns:minmax(0,1fr)}
.bx-stage[data-layers]>*{grid-area:1/1}
.bx-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;margin:18px 0 0;font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.bx-ctl{display:inline-flex;align-items:center;gap:10px}
.bx-ctl-name{text-transform:uppercase;letter-spacing:.1em;color:var(--anatomy-muted)}
.bx-ctl input{width:150px;accent-color:var(--anatomy-hi);margin:0}
.bx-ctl output{min-width:9ch}
.bx-note{color:var(--anatomy-muted)}
.bx-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.bx-controls{gap:8px 14px}.bx-ctl input{width:120px}}
@media (max-width:560px){.bx-stage{overflow:hidden;margin:0 -12px}.iso-plate .bx-stage>:is(svg,canvas){width:118%;max-width:none;margin:0 0 0 -9%}}
.iso{--sm-void:#070707;--sm-coil:#232019;--sm-glass:#0c0d0d;--sm-mesh:#0b0b0b;--sm-cut:#1f1f1f;--sm-cut-2:#191919;--sm-pear:#ffffff;--sm-lcd-bg:#050505}
.iso[data-theme="light"]{--sm-void:#c9c9c4;--sm-coil:#e9e2cf;--sm-glass:#dfe3e2;--sm-mesh:#d2d2cd;--sm-cut:#f7f7f4;--sm-cut-2:#ececE8;--sm-pear:#000000;--sm-lcd-bg:#101010}
.sm-void{fill:var(--sm-void);stroke:none}
.sm-coil{fill:var(--sm-coil);stroke:none}
.sm-glass{fill:var(--sm-glass);stroke:none}
.sm-mesh{fill:var(--sm-mesh);stroke:none}
.sm-lcd-bg{fill:var(--sm-lcd-bg);stroke:none}
.sm-img{image-rendering:pixelated;image-rendering:crisp-edges}
.sm-lcd-text{fill:#9a9a9a;font-family:var(--anatomy-mono);letter-spacing:.02em}
.sm-lcd-bar{fill:#d0d0d0;stroke:none}
.sm-scanline{fill:#d0d0d0;opacity:.55;stroke:none}
.sm-beam{pointer-events:none}
.sm-beam .sm-env{fill:var(--anatomy-lit);opacity:.22;stroke:none}
.sm-beam .sm-core{fill:none;stroke:var(--anatomy-lit);stroke-width:.7;stroke-linecap:round;stroke-linejoin:round}
.sm-beam .sm-dots{fill:var(--anatomy-lit);stroke:none}
.sm-beam .sm-pear{fill:var(--sm-pear);opacity:.55;stroke:none}
.sm-beam .sm-pear-edge{fill:none;stroke:var(--anatomy-lit);stroke-width:.7;stroke-linejoin:round}
.sm-beam .sm-spot{fill:var(--anatomy-lit);stroke:none}
.sm-beam .sm-halo{fill:var(--anatomy-lit);opacity:.25;stroke:none;filter:blur(1.2px)}
.iso[data-theme="light"] .sm-beam .sm-env{opacity:.16}
.iso[data-theme="light"] .sm-beam .sm-pear{opacity:.32}
.sm-seg{display:inline-flex;align-items:center;gap:10px;margin:0;padding:0;border:0;min-inline-size:0}
.sm-seg legend{float:left;margin-right:10px;padding:0}
.sm-seg label{position:relative;display:inline-flex;cursor:pointer}
.sm-seg label+label{margin-left:-1px}
.sm-seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sm-seg span{padding:4px 9px;border:1px solid var(--anatomy-mid);color:var(--anatomy-muted);letter-spacing:.06em}
.sm-seg label:first-of-type span{border-radius:2px 0 0 2px}
.sm-seg label:last-of-type span{border-radius:0 2px 2px 0}
.sm-seg input:checked+span{background:var(--anatomy-hi);color:var(--anatomy-card)}
.sm-seg input:focus-visible+span{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.bx-controls .bx-note{flex-basis:100%}
@media (max-width:560px){.iso-plate-corner[data-corner="readout"]{font-size:8px;letter-spacing:.01em}.sm-seg span{padding:4px 6px}}
.sm-cut{fill:var(--sm-cut);stroke:none}
.sm-cut-2{fill:var(--sm-cut-2);stroke:none}

// Pure SEM model: every number and the image the figure shows come from here.
// Kanaya-Okayama electron range, Reimer backscatter coefficient, universal SE yield curve,
// probe size from source, spherical, chromatic and diffraction terms, shot-noise limited image.
// Values are illustrative but physically consistent (Schottky FEG, 30 um aperture).

// Z, A (g/mol), rho (g/cm3), SE yield peak dm at energy Em (keV)
const MATERIALS = {
  si: { label: "Si", Z: 14, A: 28.09, rho: 2.33, dm: 1.1, Em: 0.4 },
  au: { label: "Au", Z: 79, A: 196.97, rho: 19.32, dm: 1.4, Em: 0.8 },

const SOURCE = { brightness: 5e8, dE: 0.6, Cs: 2.0, Cc: 1.5, aperture: 15e-3 }; // A/(cm2 sr) at 20 kV, eV, mm, mm, aperture radius mm
const DISPLAY = { widthMm: 100, dwellUs: 5 };
const LIMITS = { kV: [1, 30], pA: [1, 2000], wd: [4, 20], mag: [100, 200000] };
const DEFAULTS = { kV: 10, pA: 100, wd: 8, det: "se", mag: 30000 };

const E = 1.602e-19;

// Kanaya-Okayama range (um) for a material at beam energy kV.
const kanayaRange = (kV, mat) => {
  const m = MATERIALS[mat];
  return (0.0276 * m.A * kV ** 1.67) / (m.Z ** 0.889 * m.rho);

// Interaction volume extent (um): depth and lateral radius, pear shaped.
const volume = (kV, mat) => {
  const R = kanayaRange(kV, mat);
  return { depth: R, radius: 0.8 * R };

// Backscatter coefficient (Reimer fit).
const eta = (Z) => -0.0254 + 0.016 * Z - 1.86e-4 * Z * Z + 8.3e-7 * Z ** 3;

// Secondary electron yield from the universal curve.
const seYield = (kV, mat) => {
  const m = MATERIALS[mat];
  const x = kV / m.Em;
  return 1.11 * m.dm * x ** -0.35 * (1 - Math.exp(-2.3 * x ** 1.35));

// Probe diameter (nm) from source, spherical, chromatic and diffraction contributions.
function probe(p) {
  const wd = p.wd;
  const alpha = SOURCE.aperture / wd; // rad
  const beta = ((SOURCE.brightness * p.kV) / 20) / 1e14; // A/(nm2 sr)
  const dg = Math.sqrt((4 * p.pA * 1e-12) / (Math.PI ** 2 * beta * alpha ** 2));
  const Cs = SOURCE.Cs * (wd / 8) * 1e6; // nm
  const Cc = SOURCE.Cc * (wd / 8) * 1e6; // nm
  const ds = 0.5 * Cs * alpha ** 3;
  const dc = Cc * ((SOURCE.dE / (p.kV * 1000)) * alpha);
  const V = p.kV * 1000;
  const lambda = 1.226 / Math.sqrt(V * (1 + 0.9785e-6 * V)); // nm
  const dd = (1.22 * lambda) / (2 * alpha);
  return { total: Math.sqrt(dg * dg + ds * ds + dc * dc + dd * dd), dg, ds, dc, dd, alpha, lambda };

const fov = (mag) => (DISPLAY.widthMm * 1e6) / mag;

// Chamber vacuum (Torr) by region.
const pressures = () => [
  { name: "gun", torr: 5e-9 },
  { name: "column", torr: 1e-6 },
  { name: "chamber", torr: 5e-6 },

const electronsPerPixel = (p) => (p.pA * 1e-12 * DISPLAY.dwellUs * 1e-6) / E;

const TILE = 5000;
const SCENE = (() => {

  let ny = 0;

    let dy = wy - sp.y;

      ny = dy / sp.r;

      let s = 0;
      for (let i = -r; i <= r; i++) s += k[i + r] * tmp[Math.min(h - 1, Math.max(0, y + i)) * w + x];

  }
  return out;
}

// Noise-free mean signal (electrons collected per pixel) and the blur applied.
function renderClean(p, w, h) {
  const F = fov(p.mag);
  const px = F / w;
  const N = electronsPerPixel(p);
  const dSi = seYield(p.kV, "si");
  const dAu = seYield(p.kV, "au");
  const eSi = eta(MATERIALS.si.Z);
  const eAu = eta(MATERIALS.au.Z);
  const sig = new Float32Array(w * h);
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const s = sample(2500 + (i / w - 0.5) * F, 2500 + (j / w - 0.5) * F);
      let v;
      if (p.det === "se") {
        v = 0.3 * (s.au ? dAu : dSi) / Math.max(0.25, s.nz);
      } else {
        v = 0.25 * (s.au ? eAu : eSi) * (1 + 0.5 * (1 - s.nz) + 0.4 * s.nx);
      }
      sig[j * w + i] = v * N;
    }
  }
  // Probe blur for SE; BSE is further limited by the interaction volume at high kV.
  const pr = probe(p).total;
  const reach = p.det === "bse" ? Math.max(pr, 0.1 * kanayaRange(p.kV, "si") * 1000 * 0.2) : pr;
  const sigmaPx = Math.max(0.6, reach / px / 2.355);
  return { sig: blur(sig, w, h, sigmaPx), N, pixelNm: px, sigmaPx };

// Seeded shot noise on a clean signal, auto-scaled to 0..1.
function noisy(clean, seed = 3) {
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const a = clean.sig;
  const out = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) {
    const g = Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
    out[i] = Math.max(0, a[i] + Math.sqrt(a[i]) * g);
  }
  // Auto gain: stretch between the 1st and 99.5th percentile so a few hot pixels do not flatten the picture.
  const sorted = Float32Array.from(out).sort();
  const lo = sorted[Math.floor(0.01 * (sorted.length - 1))];
  const hi = sorted[Math.floor(0.995 * (sorted.length - 1))];
  const span = Math.max(1e-9, hi - lo);
  for (let i = 0; i < out.length; i++) out[i] = Math.min(1, Math.max(0, (out[i] - lo) / span));
  return out;
}

// Summary for the readout.

    depthUm: kanayaRange(p.kV, "si"),
    depthAuUm: kanayaRange(p.kV, "au"),
    fovNm: fov(p.mag),
    electrons: electronsPerPixel(p),
    pressures: pressures(),

}

// Drive a focusable stage (role=slider): rAF loop while visible, reduced motion, an idle tour, keys and announcements.
// opts.step(dt)      one frame, dt in s (at most 1/30)
// opts.rest()        draw the single representative frame shown under reduced motion
// opts.apply(next)   take a steered setting (from keys or sliders); the stage then announces and redraws
// opts.say()         text for the polite live region, read 700 ms after the last change
// opts.key           { value(), step, big, min, max, to(v) → next }: arrows ±step (Shift ±big), Home/End to the limits
// opts.tour, opts.idle   settings to cycle through while nobody steers, resuming idle ms after the last input (3600)
// Returns { media, steer, start, nextStop, begin }: nextStop() is the next tour setting, or null when not touring;
// begin(first) shows the reduced-motion frame or calls first() to paint frame zero.

  }
  const start = () => { if (!raf && visible && !media.matches) { last = 0; raf = requestAnimationFrame(tick); } };

    clearTimeout(quiet);
    quiet = setTimeout(() => { liveEl.textContent = opts.say(); }, 700);
  }
  function steer(next) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { touring = !media.matches && !held; }, idle);
    opts.apply(next);
    announce();
    if (media.matches) opts.rest();
    else start();
  }
  // while the pointer is over the stage or it has focus, the tour stays paused (held); it resumes idle ms after both leave
  const pause = () => { held = true; touring = false; clearTimeout(idleTimer); };
  const resumeLater = () => { held = stage.matches(":hover") || document.activeElement === stage; clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !media.matches && !held; }, idle); };
  const key = opts.key;

    const step = event.shiftKey ? key.big : key.step;
    let v = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp") v = key.value() + step;
    if (event.key === "ArrowLeft" || event.key === "ArrowDown") v = key.value() - step;
    if (event.key === "Home") v = key.min;

    media,
    steer,
    start,
    nextStop() {
      if (!touring || !tour.length) return null;
      stop = (stop + 1) % tour.length;
      return tour[stop];
    },
    begin(first) {
      if (media.matches) { touring = false; opts.rest(); }
      else first();
    },
  };
}

  pushImage();
  row = 0;
  scanEl.setAttribute("y", String(imgBox.y));
  const zs = placeLift();
  drawBeam(0.3, zs);
}
function retune(next) {
  if (next.mag !== undefined) params.mag = Math.round(clamp(next.mag, DATA.limits.mag[0], DATA.limits.mag[1]));
  if (next.kV !== undefined) params.kV = Math.round(clamp(next.kV, DATA.limits.kV[0], DATA.limits.kV[1]));
  if (next.pA !== undefined) params.pA = roundPa(clamp(next.pA, DATA.limits.pA[0], DATA.limits.pA[1]));
  if (next.wd !== undefined) params.wd = Math.round(clamp(next.wd, DATA.limits.wd[0], DATA.limits.wd[1]));
  if (next.det !== undefined) params.det = next.det;
  prepare();
}
const LOG_MAG = [Math.log10(DATA.limits.mag[0]), Math.log10(DATA.limits.mag[1])];
const live = liveStage(stage, {
  step: advance,
  rest: stillFrame,
  apply: retune,
  say: () => `${describe()}.`,
  key: { value: () => Math.log10(params.mag), step: 0.05, big: 0.3, min: LOG_MAG[0], max: LOG_MAG[1], to: (v) => ({ mag: 10 ** clamp(v, LOG_MAG[0], LOG_MAG[1]) }) },
  tour: TOUR,
});
inputs.kV.addEventListener("input", () => live.steer({ kV: Number(inputs.kV.value) }));
inputs.pA.addEventListener("input", () => live.steer({ pA: paOfSlider(Number(inputs.pA.value)) }));
inputs.wd.addEventListener("input", () => live.steer({ wd: Number(inputs.wd.value) }));
for (const input of detInputs) input.addEventListener("change", () => { if (input.checked) live.steer({ det: input.value }); });
prepare();
compute();
writeRows(0, IH);
pushImage();
live.begin(() => { const zs = placeLift(); drawBeam(-1, zs); });
