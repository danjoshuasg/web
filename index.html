<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instruments</title>
<style>
:root{color-scheme:dark light;--bg:#111;--card:#161616;--fg:#d8d8d8;--mute:#8a8a8a;--line:#333}
@media (prefers-color-scheme:light){:root{--bg:#f4f4f2;--card:#fff;--fg:#1a1a1a;--mute:#666;--line:#ccc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,Menlo,Consolas,monospace}
main{max-width:1200px;margin:0 auto;padding:48px 16px}
h1{font-size:1rem;font-weight:400;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .15s}
.card:hover,.card:focus-visible{outline:none;border-color:var(--fg)}
.card picture{display:block;overflow:hidden;aspect-ratio:var(--ar,1.6);border-bottom:1px solid var(--line)}
.card img{display:block;width:var(--w,100%);height:auto;margin-left:calc((100% - var(--w,100%)) / 2)}
.card div{padding:12px 16px 16px}
.card b{display:block;font-weight:400}
.card small{display:block;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Isometric instruments</h1>
<div class="grid">
<a class="card" href="hplc/hplc.html">
<picture><source srcset="hplc/shots/desk-light.png" media="(prefers-color-scheme: light)"><img src="hplc/shots/desk.png" alt="Isometric HPLC system" loading="lazy"></picture>
<div><b>Fig 1 · HPLC</b><small>reversed phase C18, pump to detector</small></div>
</a>
<a class="card" href="icpms/icpms.html" style="--w:114%">
<picture><source srcset="icpms/shots/desk-light.png" media="(prefers-color-scheme: light)"><img src="icpms/shots/desk.png" alt="Isometric ICP-MS with plasma torch" loading="lazy"></picture>
<div><b>Fig 2 · ICP-MS</b><small>plasma torch, quadrupole, He KED cell</small></div>
</a>
<a class="card" href="xrf/xrf.html">
<picture><source srcset="xrf/shots/desk-light.png" media="(prefers-color-scheme: light)"><img src="xrf/shots/desk.png" alt="Isometric EDXRF spectrometer" loading="lazy"></picture>
<div><b>Fig 3 · XRF</b><small>EDXRF, Rh tube, SDD detector</small></div>
</a>
<a class="card" href="xrd/xrd.html" style="--ar:1.5">
<picture><source srcset="xrd/shots/desk-light.png" media="(prefers-color-scheme: light)"><img src="xrd/shots/desk.png" alt="Isometric powder X-ray diffractometer" loading="lazy"></picture>
<div><b>Fig 4 · XRD</b><small>Bragg-Brentano, Cu tube, theta-theta goniometer</small></div>
</a>
<a class="card" href="sem/sem.html" style="--ar:1.4">
<picture><source srcset="sem/shots/desk-light.png" media="(prefers-color-scheme: light)"><img src="sem/shots/desk.png" alt="Isometric scanning electron microscope" loading="lazy"></picture>
<div><b>Fig 5 · SEM</b><small>Schottky FEG column, SE / BSE detectors</small></div>
</a>
</div>
</main>
</body>
</html>
