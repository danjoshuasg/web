<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EDXRF spectrometer</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.iso{--bx-lcd:#0a0a0a}
.iso[data-theme="light"]{--bx-lcd:#e8e8e5}
.bx-lcd{fill:var(--bx-lcd);stroke:none}
.bx-trace{stroke-width:.75}
.bx-pen{fill:var(--anatomy-hi)}
.bx-lcd-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.02em}
.bx-stage{touch-action:pan-y;border-radius:2px}
.bx-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.bx-stage[data-layers]{display:grid;grid-template-columns:minmax(0,1fr)}
.bx-stage[data-layers]>*{grid-area:1/1}
.bx-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;margin:18px 0 0;font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.bx-ctl{display:inline-flex;align-items:center;gap:10px}
.bx-ctl-name{text-transform:uppercase;letter-spacing:.1em;color:var(--anatomy-muted)}
.bx-ctl input{width:150px;accent-color:var(--anatomy-hi);margin:0}
.bx-ctl output{min-width:9ch}
.bx-note{color:var(--anatomy-muted)}
.bx-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.bx-controls{gap:8px 14px}.bx-ctl input{width:120px}}
@media (max-width:560px){.bx-stage{overflow:hidden;margin:0 -12px}.iso-plate .bx-stage>:is(svg,canvas){width:118%;max-width:none;margin:0 0 0 -9%}}
.iso{--xr-void:#090909;--xr-foil-al:#2c2c2c;--xr-foil-cu:#1a1a1a;--xr-spot:#ffffff}
.iso[data-theme="light"]{--xr-void:#cfcfcb;--xr-foil-al:#f4f4f1;--xr-foil-cu:#b9b9b4;--xr-spot:#000000}
.xr-void{fill:var(--xr-void);stroke:none}
.xr-foil{stroke:none}
.xr-foil-al{fill:var(--xr-foil-al)}
.xr-foil-cu{fill:var(--xr-foil-cu)}
.xr-beam{fill:var(--anatomy-lit);stroke:none;opacity:calc(.55 * var(--xr-beam,1))}
.xr-photon-lit{fill:var(--anatomy-lit);stroke:none;opacity:calc(.35 + .65 * var(--xr-beam,1))}
.xr-photon{fill:var(--anatomy-hi);stroke:none}
.xr-spot-core{fill:var(--xr-spot);stroke:none;opacity:calc(.95 * var(--xr-beam,1))}
.xr-spot-glow{fill:var(--xr-spot);stroke:none;filter:blur(1.6px);opacity:calc(.6 * var(--xr-beam,1))}
.iso[data-theme="light"] .xr-spot-glow{opacity:calc(.35 * var(--xr-beam,1))}
.xr-lcd-small{letter-spacing:0}
.xr-seg{display:inline-flex;align-items:center;gap:10px;margin:0;padding:0;border:0;min-inline-size:0}
.xr-seg legend{float:left;margin-right:10px;padding:0}
.xr-seg label{position:relative;display:inline-flex;cursor:pointer}
.xr-seg label+label{margin-left:-1px}
.xr-seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.xr-seg span{padding:4px 9px;border:1px solid var(--anatomy-mid);color:var(--anatomy-muted);letter-spacing:.06em}
.xr-seg label:first-of-type span{border-radius:2px 0 0 2px}
.xr-seg label:last-of-type span{border-radius:0 2px 2px 0}
.xr-seg input:checked+span{background:var(--anatomy-hi);color:var(--anatomy-card)}
.xr-seg input:focus-visible+span{outline:1px solid var(--anatomy-muted);outline-offset:3px}
.bx-controls .bx-note{flex-basis:100%}
@media (max-width:560px){.iso-plate-corner[data-corner="readout"]{font-size:8.5px;letter-spacing:.02em}.xr-seg span{padding:4px 6px}}

</div><span class="bx-live" aria-live="polite" data-live></span></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Primary beam from the selected filter and the excitation spot it lights on the sample's Mylar film</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Fluorescence photons on their way to the silicon drift detector; their rate follows the output count rate</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>High-voltage cable and lead, detector signal cables, helium purge and vacuum lines</span></span><span class="iso-caption">The tube runs at 40 kV and 50 µA; its Kramers continuum and Rh Kα/Kβ lines (20.216 and 22.724 keV, above the 23.22 keV K edge) pass a primary filter (none, Al 100 µm or Cu 25 µm) and excite each element whose absorption edge lies below the tube voltage: Pb L3 needs 13.035 kV and Sr K 16.105 kV, so their peaks vanish when the voltage drops below them; Fe (7.112 keV) stays excited down to the 10 kV minimum. The air path (3.5 cm in all) absorbs light-element lines, which helium or vacuum restore. The SDD (Be 12.5 µm, Si 450 µm) has a resolution of 125 eV at Mn Kα, and paralysable dead time τ = 3 µs: at the defaults on brass 3.8e4 cps come in, 3.4e4 are counted, 10.7 % dead. The spectrum is accumulated over a 30 s preset time, shown 4× faster than real time; photons are drawn at 40 and 26 units/s and the spinner turns at an assumed 0.25 rev/s. The lid is drawn raised: in use it is closed and its tongue holds the interlock plunger down; opening it cuts the high voltage.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {

    const corners = [

        [x + w - radius, y + d - radius, 0],

    const out = [];

}
function signedArea(points) {

}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);

        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {

        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

        upper.push(point);

}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;

                run = [index];
            run.push((index + 1) % count);

}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;

    const [vx, vy] = towardViewer(projection);

        const dx = bx - ax;
        const dy = by - ay;

        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);

    }
    if (height > 0) {

        }

    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {

                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));

        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);

            const [nx, ny] = normals[index];

            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));

        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {

            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];

            .map((run) => pathOf([top[run[0]], ...run.slice(1, -1).map((index) => insetTop[index]), top[run[run.length - 1]]]))

        fill,
        outline: outline.join(""),
        crease: crease.join(""),

const ringOf = (plan, steps = 8) => roundedPlan(plan, steps);

function circleRing(cx, cy, radius, steps = 40) {

function cylinder(cx, cy, radius, z, height, projection, steps = 32, bevel = 0) {

// Pure EDXRF model: every number the figure shows comes from here.
// Rh-anode tube (Kramers continuum + Rh lines), primary filter, sample fluorescence and scatter,
// air / He path, SDD detector with Be window and paralysable dead time.
// Values are illustrative but physically consistent.

const TUBE = { Z: 45, rhKa: 20.216, rhKb: 22.724, rhK: 23.22 }; // keV
const DET = { fano: 0.115, eps: 3.62, noise2: 365, tau: 3e-6, binKev: 0.02, top: 50 };
const GEOM = { pathAir: 3.5 }; // cm, tube -> sample -> detector

// ie edge: absorption edge (keV) that must be exceeded; w: fluorescence yield; lines: [label, keV, relative weight]
const ELEMENTS = {
  Ca: { Z: 20, edge: 4.038, w: 0.163, lines: [["Ca Ka", 3.692, 1], ["Ca Kb", 4.013, 0.13]] },
  Ti: { Z: 22, edge: 4.966, w: 0.214, lines: [["Ti Ka", 4.511, 1], ["Ti Kb", 4.932, 0.14]] },
  Cr: { Z: 24, edge: 5.989, w: 0.275, lines: [["Cr Ka", 5.415, 1], ["Cr Kb", 5.947, 0.15]] },
  Mn: { Z: 25, edge: 6.539, w: 0.308, lines: [["Mn Ka", 5.899, 1], ["Mn Kb", 6.49, 0.16]] },
  Fe: { Z: 26, edge: 7.112, w: 0.34, lines: [["Fe Ka", 6.404, 1], ["Fe Kb", 7.058, 0.17]] },
  Ni: { Z: 28, edge: 8.333, w: 0.41, lines: [["Ni Ka", 7.478, 1], ["Ni Kb", 8.265, 0.18]] },
  Cu: { Z: 29, edge: 8.979, w: 0.445, lines: [["Cu Ka", 8.048, 1], ["Cu Kb", 8.905, 0.19]] },
  Zn: { Z: 30, edge: 9.659, w: 0.479, lines: [["Zn Ka", 8.639, 1], ["Zn Kb", 9.572, 0.2]] },
  Sr: { Z: 38, edge: 16.105, w: 0.7, lines: [["Sr Ka", 14.165, 1], ["Sr Kb", 15.836, 0.2]] },
  Cd: { Z: 48, edge: 26.711, w: 0.84, lines: [["Cd Ka", 23.174, 1], ["Cd Kb", 26.095, 0.2]] },
  Hg: { Z: 80, edge: 12.284, w: 0.38, lines: [["Hg La", 9.989, 1], ["Hg Lb", 11.823, 0.7]] },
  Pb: { Z: 82, edge: 13.035, w: 0.38, lines: [["Pb La", 10.552, 1], ["Pb Lb", 12.614, 0.75]] },
};

// Sample presets: weight fractions and a scatter factor (light matrices scatter more).
const SAMPLES = {
  brass: { label: "brass", scatter: 0.25, wt: { Cu: 0.62, Zn: 0.35, Pb: 0.025, Fe: 0.003 } },
  soil: { label: "soil", scatter: 1.0, wt: { Ca: 0.03, Ti: 0.006, Mn: 0.001, Fe: 0.045, Zn: 0.0006, Sr: 0.0004, Pb: 0.002 } },
  plastic: { label: "RoHS plastic", scatter: 2.2, wt: { Ti: 0.01, Cr: 0.001, Cd: 0.001, Hg: 0.0008, Pb: 0.0012 } },
};

// Primary filters: mu = coef * (10/E)^3 per cm (jump below the edge for Cu), thickness in cm.
const FILTERS = {
  none: { label: "none", t: 0, coef: 0, edge: 0, jump: 1 },
  al: { label: "Al 100 um", t: 0.01, coef: 70, edge: 1.56, jump: 1 },
  cu: { label: "Cu 25 um", t: 0.0025, coef: 2000, edge: 8.979, jump: 6 },
};

const ATMOSPHERES = { air: 1, he: 0.015, vac: 0 };

const LIMITS = { kV: [10, 50], uA: [10, 200], cursor: [0.5, 30] };
const DEFAULTS = { kV: 40, uA: 50, filter: "al", atm: "air", sample: "brass", live: 30 };

const SCALE = 0.2; // overall photon scale, sets the count rate near 4e4 cps at the defaults

const filterT = (f, E) => {
  const F = FILTERS[f];
  if (!F.t) return 1;
  const mu = F.coef * (10 / E) ** 3 / (E < F.edge ? F.jump : 1);
  return Math.exp(-mu * F.t);
};

// Air or He path attenuation for a path of x cm: mu/rho ~ 22.9 (5/E)^2.8 cm2/g, rho_air 1.2e-3 g/cm3.
const pathT = (atm, E, x) => Math.exp(-ATMOSPHERES[atm] * 1.2e-3 * 22.9 * (5 / E) ** 2.8 * x);

// SDD efficiency: Be window (12.5 um) times Si absorption (450 um).
const detEff = (E) => {
  const be = Math.exp(-1.85 * 1.25e-3 * 3.3 * (3 / E) ** 2.9);
  const si = 1 - Math.exp(-2.33 * 0.045 * 26 * (10 / E) ** 2.8);
  return be * si;
};

// Primary photon flux per keV at energy E (Kramers continuum), or 0 above the tube voltage.
const kramers = (kV, uA, E) => (E < kV ? TUBE.Z * ((kV - E) / E) * uA : 0);

// Rh characteristic lines of the tube, as [energy, flux] (only if kV exceeds the Rh K edge).
const rhLines = (kV, uA) => (kV > TUBE.rhK ? [[TUBE.rhKa, 55 * uA * (kV - TUBE.rhK) ** 1.5 / 30], [TUBE.rhKb, 10 * uA * (kV - TUBE.rhK) ** 1.5 / 30]] : []);

// Excitation of an element: filtered primary flux above its edge, weighted by photoabsorption (edge/E)^3.
function excitation(el, p) {
  if (p.kV <= el.edge) return 0;
  let sum = 0;
  const n = 48;
  const dE = (p.kV - el.edge) / n;
  for (let i = 0; i < n; i++) {
    const E = el.edge + (i + 0.5) * dE;
    sum += kramers(p.kV, p.uA, E) * filterT(p.filter, E) * (el.edge / E) ** 3 * dE;
  }
  for (const [E, fl] of rhLines(p.kV, p.uA)) {
    if (E > el.edge) sum += fl * filterT(p.filter, E) * (el.edge / E) ** 3;
  }
  return sum;
}

// Peak lines of the run: fluorescence, tube Rayleigh and Compton scatter.
function lines(p) {
  const out = [];
  const smp = SAMPLES[p.sample];
  for (const sym of Object.keys(smp.wt)) {
    const el = ELEMENTS[sym];
    const ex = excitation(el, p);
    if (!ex) continue;
    for (const [label, E, rel] of el.lines) {
      const cps = SCALE * ex * smp.wt[sym] * el.w * rel * 0.9 * pathT(p.atm, E, GEOM.pathAir / 2) * detEff(E) * 30;
      out.push({ label, E, cps, sym });
    }
  }
  for (const [E, fl] of rhLines(p.kV, p.uA)) {
    const Ec = E / (1 + (E / 511) * (1 - Math.cos(Math.PI / 2)));
    const eff = filterT(p.filter, E) * pathT(p.atm, E, GEOM.pathAir) * detEff(E) * SCALE * smp.scatter;
    out.push({ label: E > 21 ? "Rh Kb" : "Rh Ka", E, cps: fl * eff * 0.12, sym: "Rh", scatter: true });
    out.push({ label: E > 21 ? "Rh Kb C" : "Rh Ka C", E: Ec, cps: fl * eff * 0.07, sym: "Rh", compton: true });
  }
  return out;
}

const sigma = (E) => Math.sqrt(DET.noise2 + DET.fano * DET.eps * E * 1000) / 1000; // keV

// Smooth expected spectrum (cps per bin) for a run.
function run(p) {
  const L = lines(p);
  const nb = Math.round(DET.top / DET.binKev);
  const bins = new Float64Array(nb);
  const smp = SAMPLES[p.sample];
  for (let i = 0; i < nb; i++) {
    const E = (i + 0.5) * DET.binKev;
    // Scattered continuum: weak, rises with scatter factor, filtered and absorbed like the rest.
    const cont = E > 1 && E < p.kV ? kramers(p.kV, p.uA, E) * filterT(p.filter, E) * pathT(p.atm, E, GEOM.pathAir) * detEff(E) : 0;
    bins[i] = cont * SCALE * smp.scatter * 0.006 * DET.binKev;
  }
  for (const l of L) {
    const s = sigma(l.E);
    const lo = Math.max(0, Math.floor((l.E - 5 * s) / DET.binKev));
    const hi = Math.min(nb - 1, Math.ceil((l.E + 5 * s) / DET.binKev));
    for (let i = lo; i <= hi; i++) {
      const E = (i + 0.5) * DET.binKev;
      bins[i] += (l.cps * DET.binKev * Math.exp(-0.5 * ((E - l.E) / s) ** 2)) / (s * Math.sqrt(2 * Math.PI));
    }
  }
  const inCps = bins.reduce((a, b) => a + b, 0);
  const outCps = inCps * Math.exp(-inCps * DET.tau);
  return { lines: L, bins, inCps, outCps, dead: 1 - Math.exp(-inCps * DET.tau), at: (E) => bins[Math.min(nb - 1, Math.max(0, Math.floor(E / DET.binKev)))] / DET.binKev };
}

// Nearest labelled line within tol keV of E, or null.
function identify(r, E, tol = 0.2) {
  let best = null;
  for (const l of r.lines) {
    const d = Math.abs(l.E - E);
    if (d <= tol && l.cps > 0.5 && (!best || d < best.d)) best = { d, label: l.label, E: l.E, cps: l.cps };
  }
  return best;
}

// Deterministic Poisson-like counts after a live time (s); seeded so every frame is repeatable.
function counts(r, live, seed = 7) {
  let s = seed >>> 0;
  const rnd = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const k = (1 - r.dead) * live;
  return Array.from(r.bins, (m) => {
    const mean = m * k;
    const g = Math.sqrt(-2 * Math.log(rnd() + 1e-12)) * Math.cos(2 * Math.PI * rnd());
    return Math.max(0, Math.round(mean + Math.sqrt(mean) * g));
  });
}

// Live runtime shared by the bench figures. A plain script (no import or export): the build inlines it after the kit
// and the figure's model, before the figure's live.js, all in one module scope. Its top-level names are exactly
// clamp, smoothstep, screenOf, ease and liveStage; scriptOf (common/bench.mjs) fails the build on any clash.

// clamp v to [lo, hi]
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
// cubic ease of x across [a, b], 0 below and 1 above
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// screen offset of the world vector v under projection proj
const screenOf = (v, proj) => { const a = iso([0, 0, 0], proj), b = iso(v, proj); return [b[0] - a[0], b[1] - a[1]]; };
// first-order approach of `from` toward `to` with time constant tau (s) over a step dt (s)
const ease = (from, to, tau, dt) => from + (to - from) * (1 - Math.exp(-dt / tau));

// Drive a focusable stage (role=slider): rAF loop while visible, reduced motion, an idle tour, keys and announcements.
// opts.step(dt)      one frame, dt in s (at most 1/30)
// opts.rest()        draw the single representative frame shown under reduced motion
// opts.apply(next)   take a steered setting (from keys or sliders); the stage then announces and redraws
// opts.say()         text for the polite live region, read 700 ms after the last change
// opts.key           { value(), step, big, min, max, to(v) → next }: arrows ±step (Shift ±big), Home/End to the limits
// opts.tour, opts.idle   settings to cycle through while nobody steers, resuming idle ms after the last input (3600)
// Returns { media, steer, start, nextStop, begin }: nextStop() is the next tour setting, or null when not touring;
// begin(first) shows the reduced-motion frame or calls first() to paint frame zero.
function liveStage(stage, opts) {
  const media = matchMedia("(prefers-reduced-motion: reduce)");
  const liveEl = document.querySelector("[data-live]");
  const tour = opts.tour ?? [];
  const idle = opts.idle ?? 3600;
  let raf = 0, last = 0, visible = false, touring = !media.matches, idleTimer = 0, stop = 0, quiet = 0, held = false;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    opts.step(dt);
    raf = visible ? requestAnimationFrame(tick) : 0;
  }
  const start = () => { if (!raf && visible && !media.matches) { last = 0; raf = requestAnimationFrame(tick); } };
  function announce() {
    clearTimeout(quiet);
    quiet = setTimeout(() => { liveEl.textContent = opts.say(); }, 700);
  }
  function steer(next) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { touring = !media.matches && !held; }, idle);
    opts.apply(next);
    announce();
    if (media.matches) opts.rest();
    else start();
  }
  // while the pointer is over the stage or it has focus, the tour stays paused (held); it resumes idle ms after both leave
  const pause = () => { held = true; touring = false; clearTimeout(idleTimer); };
  const resumeLater = () => { held = stage.matches(":hover") || document.activeElement === stage; clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !media.matches && !held; }, idle); };
  const key = opts.key;
  if (key) stage.addEventListener("keydown", (event) => {
    const step = event.shiftKey ? key.big : key.step;
    let v = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp") v = key.value() + step;
    if (event.key === "ArrowLeft" || event.key === "ArrowDown") v = key.value() - step;
    if (event.key === "Home") v = key.min;
    if (event.key === "End") v = key.max;
    if (v === null) return;
    event.preventDefault();
    steer(key.to(v));
  });
  stage.addEventListener("pointerenter", pause);
  stage.addEventListener("pointerleave", resumeLater);
  stage.addEventListener("focus", () => { pause(); liveEl.textContent = stage.getAttribute("aria-valuetext"); });
  stage.addEventListener("blur", resumeLater);
  media.addEventListener?.("change", () => { touring = !media.matches; if (media.matches) opts.rest(); else start(); });
  new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) start(); }, { rootMargin: "120px 0px" }).observe(stage);
  return {
    media,
    steer,
    start,
    nextStop() {
      if (!touring || !tour.length) return null;
      stop = (stop + 1) % tour.length;
      return tour[stop];
    },
    begin(first) {
      if (media.matches) { touring = false; opts.rest(); }
      else first();
    },
  };
}

const noteEl = document.querySelector("[data-note]");
const inputs = { kV: document.querySelector('[data-ctl="kV"]'), uA: document.querySelector('[data-ctl="uA"]') };
const outputs = { kV: document.querySelector('[data-out="kV"]'), uA: document.querySelector('[data-out="uA"]') };
const groups = ["filter", "atm", "sample"].map((key) => [key, [...document.querySelectorAll(`[data-group="${key}"] input`)]]);
const SVGNS = "http://www.w3.org/2000/svg";

// ---------------------------------------------------------------- the run: model result, acquisition clock, wording
const params = { ...DATA.defaults, cursor: 8.05 };
const PRESET = DATA.defaults.live;
let result, topCounts, inMax;
let acq = 0; // acquisition clock (s of preset time)
let hold = 0; // real seconds the finished spectrum has been held
const fmtCps = (c) => {
  if (c < 1e3) return c < 10 ? c.toFixed(1) : c.toFixed(0);
  const e = Math.floor(Math.log10(c));
  return `${(c / 10 ** e).toFixed(1)}e${e}`;
};
const lineName = (label) => label.replace(/ Ka$/, " Kα").replace(/ Kb$/, " Kβ").replace(/ La$/, " Lα").replace(/ Lb$/, " Lβ").replace(/ Ka C$/, " Kα C").replace(/ Kb C$/, " Kβ C");
const ATM_WORD = { air: "air", he: "helium", vac: "vacuum" };
const filterWord = (f) => FILTERS[f].label.replace("um", "µm");
const cursorLine = () => identify(result, params.cursor, 0.2);

function prepare() {
  result = run(params);
  // full scale of the log display: the tallest bin at the end of the preset time, with headroom
  let peak = 0;
  for (const m of result.bins) peak = Math.max(peak, m);
  topCounts = Math.max(10, peak * (1 - result.dead) * PRESET * 1.6);
  // the brightest primary beam this figure can show: 50 kV, 200 µA, no filter, on brass
  inMax = run({ ...params, kV: DATA.limits.kV[1], uA: DATA.limits.uA[1], filter: "none", sample: "brass", atm: "vac" }).inCps;
  for (const key of ["kV", "uA"]) {
    if (Number(inputs[key].value) !== params[key]) inputs[key].value = params[key];
    inputs[key].setAttribute("aria-valuetext", key === "kV" ? `${params.kV} kilovolts` : `${params.uA} microamps`);
    outputs[key].textContent = key === "kV" ? `${params.kV} kV` : `${params.uA} µA`;
  }
  for (const [key, list] of groups) for (const input of list) input.checked = input.value === params[key];
  findPeaks();
  intensity();
  stage.setAttribute("aria-valuenow", params.cursor.toFixed(2));
  stage.setAttribute("aria-valuetext", describe());
}
function describe() {
  const hit = cursorLine();
  return `${params.cursor.toFixed(2)} keV, ${hit ? `${lineName(hit.label)} at ${hit.E.toFixed(2)} keV, ${fmtCps(hit.cps)} counts per second` : "no line"}; ${params.kV} kilovolts, ${params.uA} microamps, ${filterWord(params.filter)} filter, ${ATM_WORD[params.atm]} path, ${SAMPLES[params.sample].label}; ${fmtCps(result.inCps)} counts per second in, ${fmtCps(result.outCps)} out, ${(result.dead * 100).toFixed(1)} percent dead time`;
}

// ---------------------------------------------------------------- spectrum on the LCD (screen coordinates x, −z)
const { x0: PX0, x1: PX1, z0: PZ0, z1: PZ1 } = DATA.plot;
const [E0, E1] = DATA.eAxis;
const xOf = (E) => PX0 + ((PX1 - PX0) * (E - E0)) / (E1 - E0);
const PTOP = PZ1 - 3; // the trace keeps clear of the top grid line, where the peak names go
const zOf = (c) => PZ0 + (PTOP - PZ0) * clamp(Math.log10(1 + c) / Math.log10(1 + topCounts), 0, 1);
const BIN = DET.binKev;
const NB = Math.round((E1 - E0) / BIN);
const COLS = 300;
const traceEl = partOf("trace");
const penEl = partOf("pen");
const cursorEl = partOf("gradient");
const clockEl = partOf("clock");
const phaseEl = partOf("phase");
const peaksEl = partOf("peaks");
let shown = null; // counts on screen
let peakMarks = [];
function findPeaks() {
  // local maxima of the expected spectrum, named by identify(); strongest first, one name per 0.45 keV
  const b = result.bins;
  const found = [];
  for (let i = 3; i < NB - 3; i++) {
    if (b[i] > b[i - 1] && b[i] >= b[i + 1] && b[i] > b[i - 3] * 1.3 && b[i] > b[i + 3] * 1.3) {
      const E = (i + 0.5) * BIN;
      const hit = identify(result, E, 0.15);
      if (hit && !hit.label.endsWith(" C")) found.push({ E, i, label: hit.label, m: b[i] });
    }
  }
  found.sort((p, q) => q.m - p.m);
  peakMarks = [];
  for (const p of found) {
    if (peakMarks.length >= 6) break;
    if (peakMarks.some((q) => Math.abs(q.E - p.E) < 0.45)) continue;
    peakMarks.push(p);
  }
  peaksEl.textContent = "";
  for (const p of peakMarks) {
    const t = document.createElementNS(SVGNS, "text");
    t.setAttribute("class", "bx-lcd-text xr-lcd-small");
    t.setAttribute("font-size", "2.4");
    t.setAttribute("text-anchor", "middle");
    t.textContent = p.label.split(" ")[0] + " " + p.label.split(" ")[1].replace("a", "α").replace("b", "β");
    peaksEl.appendChild(t);
    p.el = t;
  }
}
function drawSpectrum() {
  shown = counts(result, acq, 7);
  let d = "";
  const per = NB / COLS;
  for (let c = 0; c < COLS; c++) {
    let m = 0;
    for (let i = Math.floor(c * per); i < Math.floor((c + 1) * per); i++) m = Math.max(m, shown[i]);
    const x = xOf(E0 + ((c + 0.5) * per) * BIN);
    d += (c ? "L" : "M") + x.toFixed(2) + " " + (-zOf(m)).toFixed(2);
  }
  traceEl.setAttribute("d", d);
  // names sit above their peaks; a name that would overlap the one to its left is stacked above it
  let prev = null;
  for (const p of [...peakMarks].sort((u, w) => u.E - w.E)) {
    let m = 0;
    for (let i = p.i - 2; i <= p.i + 2; i++) m = Math.max(m, shown[i]);
    const x = xOf(p.E);
    let z = Math.min(zOf(m) + 1.4, PZ1 + 0.6);
    if (prev && x - prev.x < 7.6) z = Math.max(z, prev.z + 2.7);
    const show = m > 3 && z <= PZ1 + 0.6; // a name with no room under the header is left out
    p.el.setAttribute("x", x.toFixed(2));
    p.el.setAttribute("y", (-z).toFixed(2));
    p.el.style.opacity = show ? "1" : "0";
    if (show) prev = { x, z };
  }
}
function drawCursor() {
  const x = xOf(params.cursor);
  const i = Math.min(NB - 1, Math.floor(params.cursor / BIN));
  let m = 0;
  if (shown) for (let j = Math.max(0, i - 1); j <= Math.min(NB - 1, i + 1); j++) m = Math.max(m, shown[j]);
  cursorEl.setAttribute("d", `M${x.toFixed(2)} ${(-PZ0).toFixed(2)}V${(-PZ1).toFixed(2)}`);
  penEl.setAttribute("cx", x.toFixed(2));
  penEl.setAttribute("cy", (-zOf(m)).toFixed(2));
  const hit = cursorLine();
  clockEl.textContent = `${params.cursor.toFixed(2)} keV ${hit ? lineName(hit.label) : "—"}`;
  phaseEl.textContent = `LT ${(acq * (1 - result.dead)).toFixed(1)} s`;
}
function axisTicks() {
  let d = "";
  for (let E = E0; E <= E1 + 1e-9; E += 1) d += `M${xOf(E).toFixed(2)} ${(-PZ0).toFixed(2)}v${E % 5 ? 1.1 : 2}`;
  partOf("ticks").setAttribute("d", d);
  partOf("reveal").setAttribute("width", String(DATA.screen.x1 - DATA.screen.x0));
}

// ---------------------------------------------------------------- world geometry for the moving parts
const pointOn = (F, s, r, t) => [0, 1, 2].map((j) => F.o[j] + F.a[j] * s + r * (F.u[j] * Math.cos(t) + F.v[j] * Math.sin(t)));
const circleAround = (F, c, r, n = 24) => pathOf(Array.from({ length: n }, (_, i) => { const t = (i / n) * Math.PI * 2; return iso([0, 1, 2].map((j) => c[j] + r * (F.u[j] * Math.cos(t) + F.v[j] * Math.sin(t))), P); }), true);
const dotD = (sx, sy, r) => `M${(sx - r).toFixed(2)} ${sy.toFixed(2)}a${r.toFixed(2)} ${r.toFixed(2)} 0 1 0 ${(2 * r).toFixed(2)} 0a${r.toFixed(2)} ${r.toFixed(2)} 0 1 0 ${(-2 * r).toFixed(2)} 0`;
const K = cameraOf(P).k;

// filter wheel: aperture j sits on the beam (angle π in the wheel frame) when the wheel is at π − j·120°
const WH = DATA.wheel;
const wheelTarget = () => Math.PI - WH.order.indexOf(params.filter) * ((Math.PI * 2) / 3);
const wheel = { x: wheelTarget(), v: 0 };
// how squarely an aperture sits on the beam: while the wheel turns, solid wheel blocks the beam
const aligned = () => {
  const step = (Math.PI * 2) / 3;
  const off = Math.abs(((((wheel.x - Math.PI) % step) + step * 1.5) % step) - step / 2);
  return 1 - smoothstep(0.04, 0.2, off);
};
const apEls = { none: partOf("ap-none"), al: partOf("ap-al"), cu: partOf("ap-cu"), rims: partOf("ap-rims") };
function drawWheel() {
  let rims = "";
  WH.order.forEach((f, j) => {
    const c = pointOn(WH, WH.s, WH.off, wheel.x + (j * Math.PI * 2) / 3);
    const d = circleAround(WH, c, WH.hole);
    apEls[f].setAttribute("d", d);
    rims += d + (f === "cu" ? circleAround(WH, c, WH.hole * 0.55, 18) : "");
  });
  apEls.rims.setAttribute("d", rims);
}

// primary beam: a lit ribbon from the selected aperture to the spot, brightness from the model's input count rate
const BM = DATA.beam;
const beamEl = partOf("beam");
const spotEl = partOf("spot");
const glow = { x: 0, v: 0 };
let beamLevel = 0;
function intensity() {
  beamLevel = Math.pow(clamp(result.inCps / inMax, 0, 1), 0.3);
}
function drawBeam() {
  const a = iso(pointOn(DATA.tube, BM.s0, 0, 0), P);
  const b = iso(pointOn(DATA.tube, BM.s1, 0, 0), P);
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const [r0, r1] = BM.r.map((r) => r * K * 0.9);
  beamEl.setAttribute("d", `M${(a[0] + nx * r0).toFixed(2)} ${(a[1] + ny * r0).toFixed(2)}L${(b[0] + nx * r1).toFixed(2)} ${(b[1] + ny * r1).toFixed(2)}L${(b[0] - nx * r1).toFixed(2)} ${(b[1] - ny * r1).toFixed(2)}L${(a[0] - nx * r0).toFixed(2)} ${(a[1] - ny * r0).toFixed(2)}Z`);
  stage.style.setProperty("--xr-beam", (glow.x * aligned() * (0.25 + 0.75 * beamLevel)).toFixed(3));
}

// photons: fixed slots along each path; a slot shows a photon on a lap when its draw is under the rate fraction,
// so a change of rate only takes effect as photons leave the source (nothing pops mid-flight)
const hash = (i, lap) => { const x = Math.sin(i * 127.1 + lap * 311.7) * 43758.5453; return x - Math.floor(x); };
const BEAM_N = 36, XRAY_N = 40;
let clock = 0;
const beamDots = partOf("beam-dots");
const xrayDots = partOf("xray-dots");
const beamLen = BM.s1 - BM.s0;
const rateOf = (cps) => clamp(Math.pow(cps / 1.5e5, 0.3), 0, 1);
function drawPhotons() {
  let d = "";
  const fb = rateOf(result.inCps);
  for (let i = 0; i < BEAM_N; i++) {
    const u = clock * (DATA.speed.beam / beamLen) + i / BEAM_N + hash(i, 0) * 0.02;
    const lap = Math.floor(u);
    if (hash(i, lap) > fb * aligned()) continue;
    const f = u - lap;
    const r = BM.r[0] + (BM.r[1] - BM.r[0]) * f;
    const p = iso(pointOn(DATA.tube, BM.s0 + f * beamLen, r * 0.55 * hash(i, lap + 0.5), hash(i, lap + 0.25) * Math.PI * 2), P);
    d += dotD(p[0], p[1], 0.85);
  }
  beamDots.setAttribute("d", d);
  d = "";
  const fx = rateOf(result.outCps);
  const len = DATA.det.s1;
  for (let i = 0; i < XRAY_N; i++) {
    const u = clock * (DATA.speed.xray / len) + i / XRAY_N + hash(i + 50, 0) * 0.02;
    const lap = Math.floor(u);
    if (hash(i + 50, lap) > fx) continue;
    const f = u - lap;
    const p = iso(pointOn(DATA.det, 0.6 + f * (len - 0.6), 2.8 * f * hash(i + 50, lap + 0.5), hash(i + 50, lap + 0.25) * Math.PI * 2), P);
    d += dotD(p[0], p[1], 0.75);
  }
  xrayDots.setAttribute("d", d);
}

// spinner ticks and the HV generator's fan
const ticksEl = partOf("spin-ticks");
let spin = 0;
function drawSpinner() {
  const t = radialTicks(DATA.spin.c[0], DATA.spin.c[1], DATA.spin.r, 48, 6, DATA.spin.z, [1.1, 2.2], P, spin);
  ticksEl.setAttribute("d", t.minor + t.major);
}
const FN = DATA.fan;
const fanEl = partOf("fan");
let fanAngle = 0;
function drawFan() {
  let d = "";
  for (let b = 0; b < 7; b++) {
    const pts = [];
    for (let q = 0; q <= 8; q++) {
      const f = q / 8;
      const r = FN.r0 + (FN.r1 - FN.r0) * f;
      pts.push(iso(pointOn(FN, FN.s, r, fanAngle + (b * Math.PI * 2) / 7 + 0.5 * f), P));
    }
    d += pathOf(pts);
  }
  fanEl.setAttribute("d", d);
}

// ---------------------------------------------------------------- readout and note
let lastText = "";
function drawReadout() {
  const hit = cursorLine();
  const text = `${params.kV} kV ${params.uA} µA · ${fmtCps(result.inCps)}→${fmtCps(result.outCps)} cps · DT ${(result.dead * 100).toFixed(1)} % · ${params.cursor.toFixed(2)} keV ${hit ? lineName(hit.label) : "—"}`;
  if (text !== lastText) { readoutEl.textContent = text; lastText = text; }
  noteEl.textContent = `real ${acq.toFixed(1)} / ${PRESET} s, live ${(acq * (1 - result.dead)).toFixed(1)} s · ${SAMPLES[params.sample].label} · ${filterWord(params.filter)} · ${ATM_WORD[params.atm]}`;
}

// ---------------------------------------------------------------- loop (rAF, reduced motion, tour, keys, live region: live-core)
const TOUR = [
  { cursor: 8.05 },
  { cursor: 8.64 },
  { cursor: 10.55 },
  { cursor: 10.55, kV: 12 },
  { cursor: 10.55, kV: 40, filter: "cu" },
  { cursor: 6.4, sample: "soil", filter: "al" },
  { cursor: 3.69, sample: "soil", atm: "he" },
  { cursor: 3.69, sample: "soil", atm: "vac", filter: "none" },
  { cursor: 20.22, sample: "plastic", atm: "air", filter: "al", uA: 150 },
  { cursor: 8.05, sample: "brass", filter: "al", uA: 50 },
];
const DWELL = 5.2;
let tourClock = 0;
let touched = false;
let tourPeak = -1;
let spectrumClock = 0;
function advance(dt) {
  tourClock += dt;
  if (tourClock > DWELL) {
    tourClock = 0;
    const stop = live.nextStop();
    // once someone has set the instrument, the tour leaves their settings alone and only visits the named peaks
    if (stop && !touched) retune(stop);
    else if (stop && peakMarks.length) retune({ cursor: peakMarks[(tourPeak = (tourPeak + 1) % peakMarks.length)].E });
  }
  clock += dt;
  if (acq < PRESET) acq = Math.min(PRESET, acq + dt * DATA.acq);
  else if ((hold += dt) > 2) { acq = 0; hold = 0; }
  spectrumClock += dt;
  if (spectrumClock > 1 / 12 || acq === 0) { spectrumClock = 0; drawSpectrum(); }
  // the wheel turns the short way to the selected filter (time constant 0.3 s)
  let target = wheelTarget();
  target += Math.round((wheel.x - target) / (Math.PI * 2)) * Math.PI * 2;
  wheel.x = ease(wheel.x, target, 0.3, dt);
  glow.x = ease(glow.x, 1, 0.4, dt);
  spin = (spin + Math.PI * 2 * DATA.spin.rps * dt) % (Math.PI * 2);
  fanAngle = (fanAngle + Math.PI * 2 * 0.8 * dt) % (Math.PI * 2);
  drawWheel();
  drawBeam();
  drawPhotons();
  drawSpinner();
  drawFan();
  drawCursor();
  drawReadout();
}
function stillFrame() {
  // reduced motion: one representative frame, the spectrum at its full preset time and the photons laid out once
  acq = PRESET;
  hold = 0;
  clock = 0.37;
  wheel.x = wheelTarget();
  glow.x = 1;
  drawSpectrum();
  drawWheel();
  drawBeam();
  drawPhotons();
  drawSpinner();
  drawFan();
  drawCursor();
  drawReadout();
}
function retune(next) {
  const before = `${params.kV}|${params.uA}|${params.filter}|${params.atm}|${params.sample}`;
  if (next.cursor !== undefined) params.cursor = Math.round(clamp(next.cursor, DATA.limits.cursor[0], DATA.limits.cursor[1]) * 100) / 100;
  if (next.kV !== undefined) params.kV = Math.round(clamp(next.kV, DATA.limits.kV[0], DATA.limits.kV[1]));
  if (next.uA !== undefined) params.uA = Math.round(clamp(next.uA, DATA.limits.uA[0], DATA.limits.uA[1]) / 5) * 5;
  for (const key of ["filter", "atm", "sample"]) if (next[key] !== undefined) params[key] = next[key];
  const changed = before !== `${params.kV}|${params.uA}|${params.filter}|${params.atm}|${params.sample}`;
  prepare();
  if (changed) { acq = live && !live.media.matches ? 0 : PRESET; hold = 0; drawSpectrum(); }
}
const live = liveStage(stage, {
  step: advance,
  rest: stillFrame,
  apply: (next) => { touched = true; retune(next); },
  say: () => `${describe()}.`,
  key: { value: () => params.cursor, step: 0.05, big: 1, min: DATA.limits.cursor[0], max: DATA.limits.cursor[1], to: (cursor) => ({ cursor }) },
  tour: TOUR,
});
inputs.kV.addEventListener("input", () => live.steer({ kV: Number(inputs.kV.value) }));
inputs.uA.addEventListener("input", () => live.steer({ uA: Number(inputs.uA.value) }));
for (const [key, list] of groups) for (const input of list) input.addEventListener("change", () => { if (input.checked) live.steer({ [key]: input.value }); });
prepare();
axisTicks();
live.begin(() => { acq = 0; drawSpectrum(); advance(1 / 60); });
</script></body></html>
