<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ICP-MS</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--bx-lcd:#0a0a0a}
.iso[data-theme="light"]{--bx-lcd:#e8e8e5}
.bx-lcd{fill:var(--bx-lcd);stroke:none}
.bx-trace{stroke-width:.75}
.bx-pen{fill:var(--anatomy-hi)}
.bx-lcd-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.02em}
.bx-stage{touch-action:pan-y;border-radius:2px}
.bx-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.bx-stage[data-layers]{display:grid;grid-template-columns:minmax(0,1fr)}
.bx-stage[data-layers]>*{grid-area:1/1}
.bx-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;margin:18px 0 0;font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.bx-ctl{display:inline-flex;align-items:center;gap:10px}
.bx-ctl-name{text-transform:uppercase;letter-spacing:.1em;color:var(--anatomy-muted)}
.bx-ctl input{width:150px;accent-color:var(--anatomy-hi);margin:0}
.bx-ctl output{min-width:9ch}
.bx-note{color:var(--anatomy-muted)}
.bx-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.bx-controls{gap:8px 14px}.bx-ctl input{width:120px}}
@media (max-width:560px){.bx-stage{overflow:hidden;margin:0 -12px}.iso-plate .bx-stage>:is(svg,canvas){width:118%;max-width:none;margin:0 0 0 -9%}}
.iso{--ic-void:#0a0a0a}
.iso[data-theme="light"]{--ic-void:#cfcfcb}
.ic-void{fill:var(--ic-void);stroke:none}
.ic-beam{fill:var(--anatomy-hi);stroke:none}
.ic-roller{fill:var(--anatomy-shade-0);stroke:var(--anatomy-mid);stroke-width:.45;vector-effect:non-scaling-stroke}
.ic-mode{display:inline-flex;gap:0;padding:0;border:1px solid var(--anatomy-mid);border-radius:2px;background:none;font:inherit;color:var(--anatomy-muted);cursor:pointer;letter-spacing:.1em}
.ic-mode span{padding:4px 9px}
.ic-mode[data-state="std"] [data-on="std"],.ic-mode[data-state="ked"] [data-on="ked"],.ic-mode:not([data-state]) [data-on="std"]{background:var(--anatomy-hi);color:var(--anatomy-card)}
.ic-mode:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:4px}
.ic-oil{fill:var(--anatomy-shade-0);stroke:none}
.iso{--ic-plasma:#ffffff}
.iso[data-theme="light"]{--ic-plasma:#e6ddff}
.ic-plasma-core{fill:var(--ic-plasma);stroke:none}
.bx-stage[data-layers]{position:relative}
.bx-stage>.ic-gl{display:block;width:100%;height:auto;aspect-ratio:900/460;pointer-events:none}
.bx-stage>.ic-front{pointer-events:none}
.iso:not([data-theme="light"]) .ic-gl{mix-blend-mode:screen}
.bx-stage[data-gl] .ic-plasma{display:none}
.iso{--ic-plasma-body:#b9a6ff;--ic-plasma-glow:#8f72ff}
.iso[data-theme="light"]{--ic-plasma-body:#7552e0;--ic-plasma-glow:#9a7cf2}
.ic-plasma-edge{stroke:var(--ic-plasma-body)!important}
.ic-plasma-glow{fill:var(--ic-plasma-glow);stroke:none;filter:blur(3px);opacity:calc(.9 * var(--ic-heat,.6))}
.iso:not([data-theme="light"]) .ic-plasma-glow{mix-blend-mode:screen}
.iso[data-theme="light"] .ic-plasma-glow{mix-blend-mode:multiply}
@media (max-width:560px){.iso-plate-corner[data-corner="readout"]{font-size:9px}}

</div><span class="bx-live" aria-live="polite" data-live></span></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Argon plasma in the torch: its temperature sets how much of each element is ionised</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Ion packets on the axis; the marked rod pair of the quadrupole passes only the selected m/z</span><span class="iso-key"><svg class="iso-swatch" data-mark="edge" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Sample tubing, argon, helium and cooling-water lines, foreline to the rotary pump</span></span><span class="iso-caption">Sample is pumped to a concentric nebulizer; 100 % of the aerosol reaches the plasma at 0.95 L/min. The ionisation temperature follows RF power and nebulizer flow (7500 K at 1350 W), and the Saha equation gives each element's ionised fraction. Ions cross the interface (2.0 Torr), the lenses (1.5e-4 Torr) and the analyser (5e-6 Torr). The quadrupole (r0 4 mm, 2.5 MHz) passes one m/z at a time on the Mathieu scan line (q 0.706, 0.7 u wide); the spectrum shows real isotope patterns for Fe, Cu, As, Se, Cd, Hg and Pb. In STD mode the polyatomic ArO⁺ (56) and Ar₂⁺ (80) sit on Fe and Se; in KED mode helium in the cell removes them a thousandfold and costs the analytes 60–68 %. Ion packets are drawn at 70 units/s (real ions take microseconds); the pump turns at an assumed 0.1 rev/s.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {

  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));

  };
  const vs = compile(gl.VERTEX_SHADER, VERTEX);
  const enabled = extensions.filter((name) => gl.getExtension(name.replace(/^GL_/, "")));
  const fs = compile(gl.FRAGMENT_SHADER, enabled.map((name) => `#extension ${name} : enable\n`).join("") + GLSL_ISO + fragment);
  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };
  const set = (name, value) => {
    const at = where[name];
    if (at === undefined || at === null) return;
    if (typeof value === "number") gl.uniform1f(at, value);
    else if (value.length > 4) {
      const data = value instanceof Float32Array ? value : new Float32Array(value);
      const type = types[name];
      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);
  };
  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

  { sym: "Cd", ie: 8.99, gr: 4.0, ppb: 2, iso: [[110, 0.1249], [111, 0.128], [112, 0.2413], [113, 0.1222], [114, 0.2873]] },
  { sym: "Hg", ie: 10.44, gr: 4.0, ppb: 2, iso: [[199, 0.1687], [200, 0.231], [201, 0.1318], [202, 0.2986], [204, 0.0687]] },
  { sym: "Pb", ie: 7.42, gr: 4.0, ppb: 2, iso: [[204, 0.014], [206, 0.241], [207, 0.221], [208, 0.524]] },
];

// Polyatomic background from the Ar plasma, in cps at STD. KED attenuates it much harder than analytes.
const INTERFERENCES = [
  { label: "ArO+", mz: 56, cps: 1.5e6 },
  { label: "Ar2+", mz: 80, cps: 6e7 },
];

const LIMITS = { rf: [1000, 1600], neb: [0.7, 1.1], mz: [40, 210] };
const DEFAULTS = { rf: 1350, neb: 0.95, mz: 208, mode: "std" };

const SENS = 2.5e4; // cps per ppb at full ionisation and unit transmission
const NOISE = 0.5; // dark counts, cps

// Ionisation temperature (K): rises with RF power, falls with nebuliser gas flow.
const plasmaT = (rf, neb) => 7500 + 1.2 * (rf - 1350) - 1500 * (neb - 0.95);

// Saha: fraction of atoms singly ionised at temperature T.
function ionFraction(el, T) {
  const kT = PLASMA.kB * T;
  const R = (el.gr * 2.4147e15 * T ** 1.5 * Math.exp(-el.ie / kT)) / PLASMA.ne;
  return R / (1 + R);
}

// Sample uptake and aerosol transport peak near 0.95 L/min.
const nebEfficiency = (neb) => Math.exp(-(((neb - 0.95) / 0.22) ** 2));

// Ion optics and detector transmission, mild mass dependence.
const transmission = (mz) => 1.15 - 0.0022 * mz;

// Cell mode: KED costs analyte sensitivity (more for light ions) and removes polyatomics.
const cellFactor = (mode, mz) => (mode === "ked" ? 0.3 + 0.1 * (mz / 208) : 1);
const polyFactor = (mode) => (mode === "ked" ? 1e-3 : 1);

// Quadrupole RF amplitude and DC offset (V) that pass mass mz on the scan line.
function quadRF(mz) {
  const m = mz * 1.6605e-27;
  const e = 1.602e-19;
  const w = 2 * Math.PI * QUAD.freq;
  const V = (QUAD.apexQ * m * QUAD.r0 ** 2 * w ** 2) / (4 * e);
  return { V, U: (QUAD.apexA / (2 * QUAD.apexQ)) * V, q: QUAD.apexQ, a: QUAD.apexA };
}

// Fraction of an ion of mass mzIon that the quadrupole passes when set to mzSel (unit resolution).
function transmit(mzSel, mzIon) {
  const s = QUAD.fwhm / 2.355;
  return Math.exp(-0.5 * ((mzIon - mzSel) / s) ** 2);
}

// Vacuum by stage (Torr): atmosphere, interface, ion lens, analyser, detector.
const pressures = (neb) => [
  { name: "plasma", torr: 760 },
  { name: "interface", torr: 2.0 * (neb / 0.95) },
  { name: "lens", torr: 1.5e-4 * (neb / 0.95) },
  { name: "analyser", torr: 5e-6 },
  { name: "detector", torr: 2e-6 },
];

function run(params) {
  const { rf, neb, mode } = params;
  const T = plasmaT(rf, neb);
  const eff = nebEfficiency(neb);
  const lines = [];
  const ions = ELEMENTS.map((el) => {
    const f = ionFraction(el, T);
    for (const [mz, ab] of el.iso) {
      const cps = SENS * el.ppb * ab * f * eff * transmission(mz) * cellFactor(mode, mz);
      lines.push({ sym: el.sym, mz, cps });
    }
    return { sym: el.sym, f };
  });
  for (const i of INTERFERENCES) {
    lines.push({ sym: i.label, mz: i.mz, cps: i.cps * eff * polyFactor(mode), poly: true });
  }
  const s = QUAD.fwhm / 2.355;
  const signal = (mzSel) => NOISE + lines.reduce((sum, l) => sum + l.cps * Math.exp(-0.5 * ((l.mz - mzSel) / s) ** 2), 0);
  return { T, eff, ions, lines, signal, cpsAt: signal, rfAt: quadRF, pressures: pressures(neb) };
}

// Live runtime shared by the bench figures. A plain script (no import or export): the build inlines it after the kit
// and the figure's model, before the figure's live.js, all in one module scope. Its top-level names are exactly
// clamp, smoothstep, screenOf, ease and liveStage; scriptOf (common/bench.mjs) fails the build on any clash.

// clamp v to [lo, hi]
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
// cubic ease of x across [a, b], 0 below and 1 above
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// screen offset of the world vector v under projection proj
const screenOf = (v, proj) => { const a = iso([0, 0, 0], proj), b = iso(v, proj); return [b[0] - a[0], b[1] - a[1]]; };
// first-order approach of `from` toward `to` with time constant tau (s) over a step dt (s)
const ease = (from, to, tau, dt) => from + (to - from) * (1 - Math.exp(-dt / tau));

// Drive a focusable stage (role=slider): rAF loop while visible, reduced motion, an idle tour, keys and announcements.
// opts.step(dt)      one frame, dt in s (at most 1/30)
// opts.rest()        draw the single representative frame shown under reduced motion
// opts.apply(next)   take a steered setting (from keys or sliders); the stage then announces and redraws
// opts.say()         text for the polite live region, read 700 ms after the last change
// opts.key           { value(), step, big, min, max, to(v) → next }: arrows ±step (Shift ±big), Home/End to the limits
// opts.tour, opts.idle   settings to cycle through while nobody steers, resuming idle ms after the last input (3600)
// Returns { media, steer, start, nextStop, begin }: nextStop() is the next tour setting, or null when not touring;
// begin(first) shows the reduced-motion frame or calls first() to paint frame zero.
function liveStage(stage, opts) {
  const media = matchMedia("(prefers-reduced-motion: reduce)");
  const liveEl = document.querySelector("[data-live]");
  const tour = opts.tour ?? [];
  const idle = opts.idle ?? 3600;
  let raf = 0, last = 0, visible = false, touring = !media.matches, idleTimer = 0, stop = 0, quiet = 0, held = false;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    opts.step(dt);
    raf = visible ? requestAnimationFrame(tick) : 0;
  }
  const start = () => { if (!raf && visible && !media.matches) { last = 0; raf = requestAnimationFrame(tick); } };
  function announce() {
    clearTimeout(quiet);
    quiet = setTimeout(() => { liveEl.textContent = opts.say(); }, 700);
  }
  function steer(next) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { touring = !media.matches && !held; }, idle);
    opts.apply(next);
    announce();
    if (media.matches) opts.rest();
    else start();
  }
  // while the pointer is over the stage or it has focus, the tour stays paused (held); it resumes idle ms after both leave
  const pause = () => { held = true; touring = false; clearTimeout(idleTimer); };
  const resumeLater = () => { held = stage.matches(":hover") || document.activeElement === stage; clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !media.matches && !held; }, idle); };
  const key = opts.key;
  if (key) stage.addEventListener("keydown", (event) => {
    const step = event.shiftKey ? key.big : key.step;
    let v = null;
    if (event.key === "ArrowRight" || event.key === "ArrowUp") v = key.value() + step;
    if (event.key === "ArrowLeft" || event.key === "ArrowDown") v = key.value() - step;
    if (event.key === "Home") v = key.min;
    if (event.key === "End") v = key.max;
    if (v === null) return;
    event.preventDefault();
    steer(key.to(v));
  });
  stage.addEventListener("pointerenter", pause);
  stage.addEventListener("pointerleave", resumeLater);
  stage.addEventListener("focus", () => { pause(); liveEl.textContent = stage.getAttribute("aria-valuetext"); });
  stage.addEventListener("blur", resumeLater);
  media.addEventListener?.("change", () => { touring = !media.matches; if (media.matches) opts.rest(); else start(); });
  new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) start(); }, { rootMargin: "120px 0px" }).observe(stage);
  return {
    media,
    steer,
    start,
    nextStop() {
      if (!touring || !tour.length) return null;
      stop = (stop + 1) % tour.length;
      return tour[stop];
    },
    begin(first) {
      if (media.matches) { touring = false; opts.rest(); }
      else first();
    },
  };
}

  float flick=.9+.1*noise3(vec3(p.x*.35-uTime*3.1,q*.4));
  // on paper the body is weighted toward the axis (a torus seen through reads as an outline there)
  float axial=exp(-pow(rho/(.52*R+.3),2.))*(1.-.3*exp(-pow(rho/uChan,2.))*smoothstep(.05,.3,s));
  float body=mix(torus*chan*1.25,axial*1.1,uLight);
  return inside*ball*body+tail*flick;
  }
  vec4 inkFor(vec3 seen,float cover){vec3 absorbed=1.-seen;float a=max(max(absorbed.r,max(absorbed.g,absorbed.b)),cover);return vec4(vec3(a)-absorbed,a);}
  void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  vec3 V=towardViewer();
  vec3 p0=rayOf(vb);
  // the ray's stretch within a bounding cylinder round the axis (radius 9.4 ≥ every envelope radius)
  vec2 q0=p0.yz-vec2(AY,AZ);
  vec2 d=V.yz;
  float a=dot(d,d);
  float b=dot(q0,d);
  float c=dot(q0,q0)-9.4*9.4;
  float disc=b*b-a*c;
  float E=0.;
  if(disc>0.){
    float h=sqrt(disc);
    float t0=(-b-h)/a;
    float t1=(-b+h)/a;
    float dt=(t1-t0)/28.;
    float jit=hash12(gl_FragCoord.xy+fract(uTime*.37)*41.);
    for(int i=0;i<28;i++){
      vec3 p=p0+(t0+(float(i)+jit)*dt)*V;
      E+=emission(p)*dt;
    }
  }
  float e=E*uHeat*.22;
  vec3 dark=tonemap(BODY*e*1.6+CORE*e*e*1.4,1.15);
  float m=max(dark.r,max(dark.g,dark.b));
  vec4 darkOut=vec4(dark,m);
  float k=1.-exp(-2.3*e);
  vec3 seen=mix(vec3(1.),PAPER_TINT,smoothstep(.0,.14,k));
  seen=mix(seen,PAPER_RIM,smoothstep(.1,.32,k));
  seen=mix(seen,PAPER_BODY,smoothstep(.3,.55,k));
  seen=mix(seen,PAPER_CORE,smoothstep(.78,.97,k));
  vec4 lightOut=inkFor(seen,.94*smoothstep(.72,.95,k));
  lightOut*=smoothstep(0.,.02,k);
  vec4 col=mix(darkOut,lightOut,uLight)*uFirst;
  col.rgb=min(col.rgb,vec3(col.a));
  float n=(hash12(gl_FragCoord.xy+fract(uTime*.61)*91.)+hash12(gl_FragCoord.yx*1.37+fract(uTime*.37)*57.)-1.)/255.;
  col=max(col+n*smoothstep(0.,1.5/255.,col.a),0.);
  col.rgb=min(col.rgb,vec3(col.a));
  gl_FragColor=col;
}`;
const plasmaLayer = glLayer({
  canvas: stage.querySelector(".ic-gl"),
  fragment: PLASMA_FRAG,
  view: DATA.view,
  camera: DATA.camera,
  uniforms: ["uHeat", "uLen", "uChan", "uFirst"],
  fixed: { uLight: LIGHT },
});
if (plasmaLayer) stage.setAttribute("data-gl", "");
const glow = { heat: { x: 0, v: 0 }, len: { x: 0.5, v: 0 }, chan: { x: 1.8, v: 0 }, clock: 0 };
// targets from the model: brightness from the ionisation temperature, tail from RF power, channel from nebulizer flow
const plasmaTargets = () => ({
  heat: 0.35 + 1.05 * smoothstep(6600, 8200, result.T),
  len: (params.rf - DATA.limits.rf[0]) / (DATA.limits.rf[1] - DATA.limits.rf[0]),
  chan: 1.0 + 2.2 * ((params.neb - DATA.limits.neb[0]) / (DATA.limits.neb[1] - DATA.limits.neb[0])),
});
function paintPlasma(dt, calm) {
  if (!plasmaLayer) return;
  const t = plasmaTargets();
  settle(glow.heat, t.heat, dt, 0.5, calm);
  settle(glow.len, t.len, dt, 0.6, calm);
  settle(glow.chan, t.chan, dt, 0.6, calm);
  glow.clock += dt;
  const first = calm ? 1 : smooth(0.1, 1.0, glow.clock);
  plasmaLayer.draw({ uHeat: glow.heat.x, uLen: glow.len.x, uChan: glow.chan.x, uFirst: first }, calm ? 0.8 : glow.clock);
}
// the SVG fallback glow follows the same temperature
const plasmaSvg = partOf("plasma-svg");
function paintFallback() {
  plasmaSvg.style.setProperty("--ic-heat", (0.35 + 0.65 * smoothstep(6600, 8200, result.T)).toFixed(3));
}

// ---------------------------------------------------------------- loop (rAF, reduced motion, tour, keys, live region: live-core)
const TOUR = [
  { mz: 208, mode: "std", rf: 1350 },
  { mz: 56, mode: "std" },
  { mz: 56, mode: "ked" },
  { mz: 80, mode: "ked" },
  { mz: 80, mode: "std" },
  { mz: 114, mode: "std" },
  { mz: 202, mode: "std", rf: 1550 },
  { mz: 75, mode: "ked", rf: 1550 },
  { mz: 75, mode: "ked", rf: 1150 },
  { mz: 63, mode: "ked", rf: 1350 },
];
const DWELL = 3.4;
let tourClock = 0;
function advance(dt) {
  tourClock += dt;
  if (tourClock > DWELL) {
    tourClock = 0;
    const stop = live.nextStop();
    if (stop) { Object.assign(params, stop); prepare(); paintFallback(); }
  }
  settle(shownMz, params.mz, dt, 0.25);
  rotor = (rotor + Math.PI * 2 * DATA.rps * dt) % (Math.PI * 2);
  stepPackets(dt);
  draw();
  paintPlasma(dt, false);
}
function stillFrame() {
  // reduced motion: one representative frame, the quadrupole parked on the selected mass and the beam laid out once
  shownMz.x = params.mz;
  shownMz.v = 0;
  seed = 7;
  packets.forEach((p, i) => Object.assign(p, spawn(B0 + ((B1 - B0) * (i + 0.5)) / PACKETS)));
  for (const p of packets) {
    p.sp = pick();
    p.cellDecided = p.x > DATA.cell[0];
    p.cellOut = p.cellDecided && p.uCell > cellPass(p.sp);
    p.quadOut = p.x > DATA.quad[0] ? p.uQuad > transmit(params.mz, p.sp.mz) : null;
  }
  draw();
  if (live.media.matches) paintPlasma(1 / 60, true);
}
function retune(next) {
  if (next.mz !== undefined) params.mz = Math.round(clamp(next.mz, DATA.limits.mz[0], DATA.limits.mz[1]));
  if (next.rf !== undefined) params.rf = Math.round(clamp(next.rf, DATA.limits.rf[0], DATA.limits.rf[1]) / 10) * 10;
  if (next.neb !== undefined) params.neb = Math.round(clamp(next.neb, DATA.limits.neb[0], DATA.limits.neb[1]) * 100) / 100;
  if (next.mode !== undefined) params.mode = next.mode;
  prepare();
  paintFallback();
}
const live = liveStage(stage, {
  step: advance,
  rest: stillFrame,
  apply: retune,
  say: () => `${describe()}.`,
  key: { value: () => params.mz, step: 1, big: 10, min: DATA.limits.mz[0], max: DATA.limits.mz[1], to: (mz) => ({ mz }) },
  tour: TOUR,
});
inputs.rf.addEventListener("input", () => live.steer({ rf: Number(inputs.rf.value) }));
inputs.neb.addEventListener("input", () => live.steer({ neb: Number(inputs.neb.value) }));
modeEl.addEventListener("click", () => live.steer({ mode: params.mode === "ked" ? "std" : "ked" }));
prepare();
paintFallback();
axisTicks();
live.begin(() => { stillFrame(); draw(); });
</script></body></html>
